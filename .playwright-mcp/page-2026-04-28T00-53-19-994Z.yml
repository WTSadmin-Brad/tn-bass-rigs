              - /url: https://www.basspro.com/p/rapala-crushcity-customs-mooch-minnow
            - text: on 3/16- and 1/8-ounce jigheads during his forward-facing sonar time and worked quickly down rocky banks with a
            - link "Z-Man Evergreen JackHammer ChatterBait" [ref=e457] [cursor=pointer]:
              - /url: https://www.basspro.com/p/z-man-chatterbait-jack-hammer-ever-green-custom-bladed-jig
            - text: with a Freeloader on the back in either green pumpkin magic or sungill.
          - heading "2. Takahiro Omori – 38-8 (15)" [level=3] [ref=e458]
          - figure "Takahiro Omori stuck to his strengths by fishing shallow cover with a bladed jig." [ref=e459]:
            - generic [ref=e460]: Takahiro Omori stuck to his strengths by fishing shallow cover with a bladed jig.
          - paragraph [ref=e461]:
            - text: If
            - link "Takahiro Omori" [ref=e462] [cursor=pointer]:

      - generic [ref=e100]:
        - heading "Jacob Wheeler’s Stage Seven Winning Gear" [level=1] [ref=e101]
        - heading [level=5]
        - generic [ref=e102]:
          - iframe [ref=e104]:
            - region "Video Player" [ref=f144e2]:
              - application [ref=f144e3]
              - button "Play Video" [ref=f144e6] [cursor=pointer]:
                - text: 
                - generic [ref=f144e7]: Play Video
              - text:           
          - generic [ref=e105]:
            - text: November 18, 2019 •
            - link "Bass Pro Tour" [ref=e106] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/bass-pro-tour/
          - heading "By Tyler Brinks" [level=3] [ref=e107]
          - paragraph [ref=e109]:
            - text: BRANSON, Mo. – After flooding caused Bass Pro Tour Bad Boy Mowers Stage Seven Presented by Covercraft to be moved from Grand Lake to Table Rock Lake,
            - link "Jacob Wheeler" [ref=e110] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/angler/jacob-wheeler/
            - text: was ready to get another shot at the Ozarks. He had finished fifth at Table Rock just days before during Stage Six, and was highly in tune with what the fish were doing.
          - paragraph [ref=e111]: On his second trip to “The Rock,” Wheeler walked away with the big trophy and a $100,000 payday. Here’s how he was able to amass 56 bass for 84-0 on the final day, and hold off a late charge by Brandon Palaniuk to secure his first Bass Pro Tour victory.
          - heading "Three Main Deals" [level=3] [ref=e112]:
            - strong [ref=e113]: Three Main Deals
          - paragraph [ref=e114]: Wheeler said three techniques played a role in his victory as he targeted points, humps, submerged trees, and other offshore locales. Toward the end of the Championship Round, he also keyed on docks that he felt had less pressured bass.
          - paragraph [ref=e115]: "“It was three main techniques on the final day: a drop-shot, swimbait, and a Neko rig around docks late in the day,” Wheeler said."
          - paragraph [ref=e116]: The Duckett Fishing pro started by casting the swimbait and then relied on the drop-shot as a mop-up bait.
          - paragraph [ref=e117]: “My first cast to each area was with the swimbait to try to catch the easy ones if they were grouped up. Then, I switched to the drop-shot and could pick off individual fish,” Wheeler added.
          - heading "Drop-Shot Gear" [level=3] [ref=e118]:
            - strong [ref=e119]: Drop-Shot Gear
          - paragraph [ref=e120]:
            - text: Overall, Wheeler said the drop-shot rig was his best producer during the last day. He used a hand-poured straight tail worm, as well as a Googan Baits Drag n Drop, both in the Morning Dawn color, which he rigged on a
            - link "1/0 VMC Finesse Neko Hook (opens in a new tab)" [ref=e121] [cursor=pointer]:
              - /url: https://www.basspro.com/shop/en/vmc-finesse-neko-hook?hvarAID=shopping_googleproductextensions&affcode_c=&gclid=Cj0KCQiAn8nuBRCzARIsAJcdIfP5Vf2G6Tq_ns0do_HXhgCQ9vXDKxlN0oKHEKyjo4ynhixviuNalkIaAr-7EALw_wcB&gclsrc=aw.ds
              - text: 1/0 VMC Finesse Neko Hook
            - text: with a 1/4-ounce VMC Cylinder Drop-Shot weight.
          - paragraph [ref=e122]: Wheeler said Texas-rigging the bait, as opposed to nose-hooking, was a key.
          - paragraph [ref=e123]: “I was dropping it into brush and timber, and a nose-hooked bait hangs up more,” Wheeler said. “Plus, I think you hook them better with a Texas-rig.”
          - paragraph [ref=e124]:
            - text: His drop-shot gear included a 7-foot-2 medium-heavy Duckett Jacob Wheeler Signature Series spinning rod with a 3000-sized spinning reel attached. He spooled it with
            - link "8-pound Sufix NanoBraid mainline (opens in a new tab)" [ref=e125] [cursor=pointer]:
              - /url: https://www.basspro.com/shop/en/sufix-nanobraid-nanofilament-braid?searchTerm=Sufix%20NanoBraid%20mainline
              - text: 8-pound Sufix NanoBraid mainline
            - text: and a
            - link "10-pound Sufix Advance Fluorocarbon leader (opens in a new tab)" [ref=e126] [cursor=pointer]:
              - /url: https://www.basspro.com/shop/en/sufix-advance-fluorocarbon-fishing-line?searchTerm=Sufix%20Advance%20Fluorocarbon%20leader
              - text: 10-pound Sufix Advance Fluorocarbon leader
            - text: due to the heavy cover he was fishing.
          - heading "Swimbait Gear" [level=3] [ref=e127]:
            - strong [ref=e128]: Swimbait Gear
          - paragraph [ref=e129]: The swimbait Wheeler relied on was initially designed as a saltwater bait, but Wheeler and others have learned that freshwater bass like it as well. He fished both a 3- and 4-inch Storm 360GT Largo Shad in the Pearl color, rigging it on a 3/8-ounce prototype VMC jighead.
          - paragraph [ref=e130]: “I catching suspended fish around trees and in schools on the points,” Wheeler said.
          - paragraph [ref=e131]:
            - text: He fished the swimbait on a 7-foot medium-heavy Duckett Jacob Wheeler Signature Series casting rod paired with a 6.3:1 Duckett Fishing 360 Series reel spooled with
            - link "12-pound Sufix Advance Fluorocarbon (opens in a new tab)" [ref=e132] [cursor=pointer]:
              - /url: https://www.basspro.com/shop/en/sufix-advance-fluorocarbon-fishing-line
              - text: 12-pound Sufix Advance Fluorocarbon
            - text: .
          - heading "Neko Rig Gear" [level=3] [ref=e133]:
            - strong [ref=e134]: Neko Rig Gear
          - paragraph [ref=e135]: The Neko rig was an essential tool for Wheeler late in the day as he secured the victory.
          - paragraph [ref=e136]: He fished a 5-inch Googan Baits Lunker Log in the Baby Bass color rigged on a Size 2 VMC Neko Hook, and inserted a 1/16-ounce VMC Nail Weight. His rod, reel, and line setup were identical to what he used with a drop-shot.
          - paragraph [ref=e137]: “The other places I was fishing were getting harder to catch, and I knew that the fish around the docks were not as beat up,” Wheeler shared. “Those fish on the docks really saved me.”
      - generic [ref=e139]:
        - 'heading "FantasyFishing.com Insider: Looking at distant and recent past to break down Beaver Lake" [level=1] [ref=e140]'
        - heading [level=5]
        - generic [ref=e141]:
          - 'img "Image for FantasyFishing.com Insider: Looking at distant and recent past to break down Beaver Lake" [ref=e142]'
          - generic [ref=e143]:
            - text: April 27, 2026 • Mitchell Forde •
            - link "Fantasy Fishing" [ref=e144] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/fantasy-news/
          - paragraph [ref=e145]:
            - text: For the first time in almost a decade, Beaver Lake will return to the top level of tournament fishing this week as the
            - link "Bass Pro Tour" [ref=e146] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/circuits/bass-pro-tour/
            - text: visits the Northwest Arkansas fishery for
            - link "Yuengling Light Lager Stage 5 Presented by YETI" [ref=e147] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-30-stage-5-beaver-lake/
            - text: .
          - paragraph [ref=e148]: Beaver Lake was once a mainstay for the FLW Tour, hosting events every year from 1998 through 2017 with the exception of 2010. As a result, several BPT anglers have a lot of history on the White River impoundment. But given how much both the fishery and the sport have changed in the past nine years, will that be a good thing?
          - paragraph [ref=e149]:
            - text: That’s one of the big questions
            - link "Phoenix Fantasy Fishing Presented by 13 Fishing" [ref=e150] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/fantasy-fishing/
            - text: players will have to ponder as they pick their teams for Stage 5. Here is a full breakdown of who has fared well on Beaver in the past, who might bring a new-school skill set and momentum to the event and more information to help you pick a winning lineup.
          - paragraph [ref=e151]: Be sure to submit your picks before lines in at 7:45 a.m. CT on Thursday, April 30.
          - heading "The Beaver Lake all-stars" [level=3] [ref=e152]
          - figure "Bryan Thrift has a win and two other Top 10s in 10 career events on Beaver Lake. Photo by Rob Newell" [ref=e153]:
            - generic [ref=e154]: Bryan Thrift has a win and two other Top 10s in 10 career events on Beaver Lake. Photo by Rob Newell
          - paragraph [ref=e155]: Even though Beaver hasn’t been on a national tournament schedule for a while, quite a few of the competitors at Stage 5 will find the playing field familiar. Twenty-two of the 51 pros have fished at least three past MLF events on the lake, while five have fished 10 or more.
          - paragraph [ref=e156]:
            - text: That includes a pair of past winners on Beaver in
            - link "David Dudley" [ref=e157] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/david-dudley/
            - text: and
            - link "Bryan Thrift" [ref=e158] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/bryan-thrift/
            - text: . Thrift won an FLW Tour event on the fishery in March of 2011, while Dudley prevailed the following year. Dudley, in particular, could be one to watch at this event. Even though it’s been 14 years, his win on Beaver came at almost the exact same time of year as this event, and the wacky-worm expert is always at his best around the spawn.
          - paragraph [ref=e159]:
            - text: Dudley and Thrift also each boast a pair of other Top-10 finishes on Beaver. Other anglers with multiple Top 10s on the lake include
            - link "Mark Rose" [ref=e160] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/mark-rose/
            - text: (an Arkansas native who leads the way with four Top 10s) and
            - link "Wesley Strader" [ref=e161] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/wesley-strader/
            - text: (who has more starts on Beaver than anyone else in the field with 20).
          - heading "Table Rock repeats" [level=3] [ref=e162]
          - figure "Jacob Wheeler will look to become the first angler ever to win three straight Bass Pro Tour events at Beaver Lake. Photo by Rob Matsuura" [ref=e163]:
            - generic [ref=e164]: Jacob Wheeler will look to become the first angler ever to win three straight Bass Pro Tour events at Beaver Lake. Photo by Rob Matsuura
          - paragraph [ref=e165]: While past success on a fishery usually can’t hurt, there’s a chance that it could be a red herring for this tournament. All those FLW Tour events on Beaver were contested with five-fish limits, while this one will be every fish counts (over the minimum scorable weight of 1 pound, 8 ounces). Plus, modern technology has changed the game, especially on clear-water fisheries like Beaver.
          - paragraph [ref=e166]:
            - text: But even if you don’t put much stock in past Beaver results, there’s an event that could offer some clues about who to pick – the most recent one we had, in fact. Just one lake below Beaver on the White River, Table Rock Lake hosted
            - link "REDCREST" [ref=e167] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-17-table-rock-lake/
            - text: all of two weeks ago, and there’s a good chance we see a lot of the same techniques and patterns in play. Really, you could pick the entire Top 10 from REDCREST for your fantasy squad and feel pretty good about it, but a few jump out as must-picks.
          - paragraph [ref=e168]:
            - text: Coming off back-to-back BPT wins,
            - link "Jacob Wheeler" [ref=e169] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/jacob-wheeler/
            - text: is a no-brainer. Same goes for
            - link "Drew Gill" [ref=e170] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/drew-gill-2/
            - text: ", who has two wins and five Top 10s in eight tour-level events so far in 2026."
            - link "Zack Birge" [ref=e171] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/zack-birge/
            - text: continued his exceptional season with a third-place showing on Table Rock, so it would be hard to pass him up, too.
            - link "Alton Jones Jr." [ref=e172] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/alton-jones-jr/
            - text: is good everywhere at any time, but he’s especially dangerous around the spawn. And
            - link "Brent Ehrler" [ref=e173] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/brent-ehrler/
            - text: combines Beaver experience with momentum. He’s fished nine past events on the lake (with a Top 10 in 2009), and he’s coming off consecutive Top 10s, including a fourth-place finish at REDCREST.
          - heading "Arkansas anglers at an advantage?" [level=3] [ref=e174]
          - figure "Spencer Shuffield will look to keep his recent momentum rolling in his home state. Photo by Phoenix Moore" [ref=e175]:
            - generic [ref=e176]: Spencer Shuffield will look to keep his recent momentum rolling in his home state. Photo by Phoenix Moore
          - paragraph [ref=e177]:
            - text: No one in the field is a true local to Beaver Lake, but in addition to Rose, there are three more Arkansas natives who should have a pretty good idea of how to attack the fishery. The most popular pick of the bunch will likely be
            - link "Spencer Shuffield" [ref=e178] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/spencer-shuffield-515616/
            - text: . Shuffield has knocked out five Top 10s in his past eight Bass Pro Tour events dating back to last season, and he’s one of the best with forward-facing sonar, which will probably be a player at this event.
            - link "Dylan Hays" [ref=e179] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/dylan-hays/
            - text: and
            - link "Mark Davis" [ref=e180] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/mark-davis/
            - text: also have plenty of experience on Ozark-area highland reservoirs.
          - heading "Other names to know" [level=3] [ref=e181]
          - figure "Banks Shaw will hope to bounce back from a pair of sub-30 finishes in his past two Bass Pro Tour events. Photo by Phoenix Moore" [ref=e182]:
            - generic [ref=e183]: Banks Shaw will hope to bounce back from a pair of sub-30 finishes in his past two Bass Pro Tour events. Photo by Phoenix Moore
          - list [ref=e184]:
            - listitem [ref=e185]:
              - link "Banks Shaw" [ref=e186] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/banks-shaw-6/
              - text: – Remember him? The rookie came back to Earth a bit with a rough Texas swing that saw him miss the cut at both Stage 3 and 4, but I’m not willing to leave him off my lineup. The 22-year-old still has a Tackle Warehouse Pro Circuit win and five other Top 10s in 2026 alone.
            - listitem [ref=e187]:
              - link "Justin Lucas" [ref=e188] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/justin-lucas/
              - text: – Lucas is sure to be mad at ‘em after he surprisingly struggled at REDCREST. That’s a scary proposition for an angler who hasn’t missed a Knockout Round yet this year at a regular-season event.
            - listitem [ref=e189]:
              - link "Jesse Wiggins" [ref=e190] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/jesse-wiggins/
              - text: – A fishery with spotted bass in it at a time when they’ll likely be on or near spawning beds? This event has Wiggins’ name all over it. He might never have to put down his trusty shaky head.
          - heading "My picks" [level=3] [ref=e191]
          - paragraph [ref=e192]:
            - strong [ref=e193]: "Flight 1:"
            - text: Brent Ehrler, Drew Gill, Alton Jones Jr., Wesley Strader, Jesse Wiggins
          - paragraph [ref=e194]:
            - strong [ref=e195]: "Flight 2:"
            - text: Zack Birge, David Dudley, Spencer Shuffield, Banks Shaw, Jacob Wheeler

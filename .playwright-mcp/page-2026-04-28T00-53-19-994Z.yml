        - heading [level=5]
        - generic [ref=e307]:
          - img "Image for Bass Pro Tour pros bring hands-on learning to WOLF School during REDCREST week" [ref=e308]
          - generic [ref=e309]:
            - text: April 23, 2026 • MLF •
            - link "Press Releases" [ref=e310] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/press-releases/
          - paragraph [ref=e311]:
            - text: SPRINGFIELD, Mo. – As part of REDCREST week festivities, three Major League Fishing (MLF)
            - link "Bass Pro Tour (BPT)" [ref=e312] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/circuits/bass-pro-tour/
            - text: anglers traded their rods and reels for a classroom setting last Thursday, visiting fifth grade students at the WOLF School for an interactive, hands-on learning experience centered on conservation, careers and competitive fishing.
          - paragraph [ref=e313]:
            - text: BPT pros and
            - link "REDCREST 2026" [ref=e314] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-17-table-rock-lake/
            - text: competitors
            - link "Edwin Evers" [ref=e315] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/edwin-evers/
            - text: ","
            - link "Jake Lawrence" [ref=e316] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/jake-lawrence-500859/
            - text: and
            - link "Wesley Strader" [ref=e317] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/wesley-strader/
            - text: joined MLF Competition Officials Butch Lansford and Brian Poppe along with MLF Senior Manager of PR and Communications Charity Muehlenweg to engage students in a unique program designed to go beyond a traditional classroom visit.
          - paragraph [ref=e318]: Rather than simply speaking to the students, the anglers challenged them to think like professionals. Working alongside the pros, students were tasked with building the “perfect bass lake,” considering key elements such as habitat, water quality and fish care. From there, the classroom transformed into a mock tournament setting, with students assigned real-world roles, including tournament director, fisheries biologist and television talent.
          - paragraph [ref=e319]: Each group was then presented with real scenarios that can occur during a Bass Pro Tour tournament and asked to problem-solve as a team, offering a firsthand look at the many moving parts that go into running a professional fishing tournament.
          - paragraph [ref=e320]:
            - strong [ref=e321]:
              - emphasis [ref=e322]: Photos from the WOLF School visit can be found
            - link "here" [ref=e323] [cursor=pointer]:
              - /url: https://www.dropbox.com/scl/fo/79wjk257qim85fz5oc5f8/AJT0z8RimpnywW_8r-1SIO8?rlkey=gzvi9sxejfctp27d42sr6qq4r&st=pgx3r3ye&dl=0
              - strong [ref=e324]:
                - emphasis [ref=e325]: here
            - strong [ref=e326]:
              - emphasis [ref=e327]: .
          - paragraph [ref=e328]: Students also learned about MLF Fisheries Management Division’s conservation initiatives, water safety and proper fish-handling techniques while exploring a wide range of career opportunities within the fishing and outdoors industry. The interactive format encouraged participation, creativity and critical thinking, highlighted by the “You Be the Biologist” activity, where students applied their knowledge to design and manage a thriving fishery.
          - paragraph [ref=e329]: The visit concluded with a question-and-answer session, followed by autographs and photos with the anglers.
          - paragraph [ref=e330]: “We wanted the kids to feel like they were part of the program, not just listening to it,” Strader said. “Getting them involved in building a fishery and running a tournament shows them how much goes on behind the scenes. It’s not just about catching fish – it’s about taking care of the resource, solving problems and working as a team. If even a few of them walk away thinking about a future in the outdoors, that’s a win for all of us.”
          - paragraph [ref=e331]: Community outreach during REDCREST week is one of the ways Major League Fishing connects competition with conservation and education, using the platform of professional fishing to inspire and engage the next generation.
          - paragraph [ref=e332]: The WOLF School – short for Wonders of the Ozarks Learning Facility – features state-of-the-art classrooms and resources designed to provide fifth grade students with immersive, high-quality educational experiences.
          - paragraph [ref=e333]: Major League Fishing extends its thanks to the WOLF School for hosting the pros during REDCREST week and helping create a meaningful experience for students.

        - heading [level=5]
        - generic [ref=e626]:
          - img "Image for Emptying the notebook from a memorable REDCREST on Table Rock" [ref=e627]
          - generic [ref=e628]: Takahiro Omori put together another impressive event without ever turning on his forward-facing sonar. Photo by Rob Matsuura.
          - generic [ref=e629]:
            - text: April 20, 2026 • Mitchell Forde •
            - link "Bass Pro Tour" [ref=e630] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/bass-pro-tour/
          - paragraph [ref=e631]:
            - text: SPRINGFIELD, Mo. — As expected,
            - link "Bass Pro Shops REDCREST Presented by Mercury & Lowrance" [ref=e632] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-17-table-rock-lake/
            - text: showcased a wide range of ways to catch bass. The 35-angler field faced different conditions all three days on Table Rock Lake. And even though postfrontal weather slowed the bite during the Championship Round, the competitors caught a healthy number of all three bass species using a range of techniques. Just about every area of the lake played, too, with the Top 10 featuring anglers fishing in Long Creek, the lower and middle sections of the main lake and the James River arm.
          - paragraph [ref=e633]:
            - text: While
            - link "Jacob Wheeler" [ref=e634] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/jacob-wheeler/
            - text: finally
            - link "getting the REDCREST monkey off his back" [ref=e635] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/bass-pro-tour/wheeler-a-redcrest-winner-at-last/
            - text: was the main story (and rightfully so), plenty of other interesting nuggets emerged from the event. Here are a few notes and quotes before we turn the page and start preparing for
            - link "Yuengling Light Lager Stage 5 Presented by YETI" [ref=e636] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-30-stage-5-beaver-lake/
            - text: ", which will kick off April 30 on nearby Beaver Lake."
          - heading "Non-BPT qualifiers held their own" [level=3] [ref=e637]
          - figure "Italy’s Luca Della Ciana finished 16th at REDCREST despite competing in a foreign country. Photo by Phoenix Moore" [ref=e638]:
            - generic [ref=e639]: Italy’s Luca Della Ciana finished 16th at REDCREST despite competing in a foreign country. Photo by Phoenix Moore
          - paragraph [ref=e640]:
            - text: While REDCREST is the
            - link "Bass Pro Tour" [ref=e641] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/circuits/bass-pro-tour/
            - text: championship, it features anglers from just about every level of Major League Fishing competition. Several of the non-traditional qualifiers put together excellent showings on Table Rock.
          - paragraph [ref=e642]:
            - text: Montevallo University’s
            - link "Brody Robison" [ref=e643] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/brody-robison-2/
            - text: was the highest finisher of the bunch. Robison, who won the 2025
            - link "Columbia PFG College Fishing" [ref=e644] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/circuits/college/
            - text: National Championship alongside teammate
            - link "Peyton Sorrow" [ref=e645] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/peyton-sorrow-542461/
            - text: ", then earned his REDCREST berth by bettering Sorrow at the Toyota Series Championship on Grand Lake last fall, finished 11th – the first angler below the Lucas Oil Cut Line. The near-miss had to be tough to swallow, especially considering Robison actually tied"
            - link "Brent Ehrler" [ref=e646] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/brent-ehrler/
            - text: for 10th place at the end of the two-day Qualifying Round but lost the tiebreaker, which was the biggest individual bass of the round. Still, Robison showed that he can hang with the best in the game and established himself as yet another name to watch from the college ranks.
          - paragraph [ref=e647]:
            - link "Matteo Turano" [ref=e648] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/matteo-turano-4/
            - text: ", who won the"
            - link "Phoenix Bass Fishing League" [ref=e649] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/circuits/bfl/
            - text: All-American in 2025, also put together a strong showing. He spent most of the Qualifying Round in the Top 10 before slipping to 15th on Saturday afternoon. Turano has a chance to join the Bass Pro Tour field full-time next year – he’s currently 12th in the 7 Brew Angler of the Year standings on the
            - link "Tackle Warehouse Pro Circuit" [ref=e650] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/circuits/pro-circuit/
            - text: ", and three of the anglers ahead of him are already on the BPT roster. The top five non-BPT pros at the end of the season will earn invitations to join the tour."
          - paragraph [ref=e651]: Perhaps most impressive of all, considering the circumstances, Italy’s Luca Della Ciana finished one spot behind Turano. The first-ever angler to qualify for REDCREST from the MLF International ranks, Della Ciana stacked up 47 pounds on Day 2 to climb from 29th place at the start of the day into the top half of the field. He did it while fishing out of a borrowed boat more than 5,000 miles from home. Della Ciana said he caught his fish strolling and also targeting bedding bass with Senkos.
          - paragraph [ref=e652]: “It is an insane experience, this REDCREST at Table Rock Lake,” Della Ciana said. “I have only one problem – 6 pounds from the cut.”
          - heading "Omori carries the flag for traditional techniques" [level=3] [ref=e653]
          - figure "Mark Daniels Jr. was another angler who rode old-school tactics (shallow cranking in his case) to a strong finish. Photo by Phoenix Moore" [ref=e654]:
            - generic [ref=e655]: Mark Daniels Jr. was another angler who rode old-school tactics (shallow cranking in his case) to a strong finish. Photo by Phoenix Moore
          - paragraph [ref=e656]: Table Rock is known as a prolific forward-facing sonar fishery, and the technology certainly played a big role at this event. Wheeler used forward-facing sonar to power his strong Period 1 during the Championship Round, when he amassed more than 35 pounds and put the event out of reach.
          - paragraph [ref=e657]:
            - text: "But overall, REDCREST continued a trend we’ve seen throughout 2026: Forward-facing sonar isn’t dominating at the same clip as it has in years past. Of course, part of that is due to the league limiting anglers to just one of three periods per day in which they can use the technology. But it isn’t drastically out-producing other techniques during that time. While anglers have forward-facing sonar at their disposal for one-third of the event, it accounted for about 36.5% of the total weight at REDCREST, according to"
            - emphasis [ref=e658]: SCORETRACKER Insider™
            - text: .
          - paragraph [ref=e659]:
            - text: As has been the case all year,
            - link "Takahiro Omori" [ref=e660] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/takahiro-omori/
            - text: did the most damage with traditional techniques. Omori, who won Stage 2 on Lake Hartwell, hasn’t turned on his forward-facing sonar transducers at all in 2026. He finished second on Table Rock by employing his usual strategy – running way up the rivers and throwing a bladed jig around shallow cover.
            - link "Mark Daniels Jr." [ref=e661] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/mark-daniels-jr/
            - text: and
            - link "Jeff Sprague" [ref=e662] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/jeff-sprague/
            - text: also made the Top 10 by almost exclusively power fishing.
          - paragraph [ref=e663]: Omori was charging hard at the end of the Championship Round. He stacked up seven scorable bass for 17-11 in Period 3. Easily the best final period of the field, it moved him up from fifth place to second and earned him an extra $25,000.
          - heading "Other notes:" [level=3] [ref=e664]
          - list [ref=e665]:
            - listitem [ref=e666]: Anglers found success targeting all three species (four if you count meanmouth, the smallmouth-spotted bass hybrid) on Table Rock. In the end, largemouth easily led the way, accounting for about 62.7% of the total weight across the three-day event. Smallmouth and spotted bass showed up at a similar rate, with smallmouth comprising 19.7% of the total and spots at 17.5%.
          - list [ref=e667]:
            - listitem [ref=e668]:
              - text: This event provided clear proof that momentum matters in tournament fishing. Each of the winners from the first four regular-season events of 2026 (
              - link "Drew Gill" [ref=e669] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/drew-gill-2/
              - text: ","
              - link "Zack Birge" [ref=e670] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/zack-birge/
              - text: ", Omori and Wheeler) finished in the top five, as did the top three in the Fishing Clash Angler of the Year race (Wheeler, Birge, Gill)."
          - list [ref=e671]:
            - listitem [ref=e672]: Now that Wheeler finally has his REDCREST trophy, the next breakthrough that seems inevitable is at least one of Ehrler or Sprague claiming their first Bass Pro Tour win. Both finished in the Top 10 at REDCREST. Ehrler is now up to 21 career Championship Round appearances – tied for third most in BPT history and the most for any pro without a win. Sprague is right behind him with 16 Top 10s.
      - generic [ref=e674]:
        - 'heading "GALLERY: Wheeler celebrated at Champions Toast Presented by Cigars International" [level=1] [ref=e675]'
        - heading [level=5]
        - generic [ref=e676]:
          - 'img "Image for GALLERY: Wheeler celebrated at Champions Toast Presented by Cigars International" [ref=e677]'
          - generic [ref=e678]:
            - text: April 19, 2026 • Phoenix Moore •
            - link "Bass Pro Tour" [ref=e679] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/bass-pro-tour/
          - paragraph [ref=e680]:
            - text: SPRINGFIELD, Mo. –
            - link "Jacob Wheeler" [ref=e681] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/jacob-wheeler/
            - text: had won just about everything there is to win, but one trophy was still missing from his collection – until today. Finishing off his win in
            - link "Bass Pro Shops REDCREST Presented by Mercury & Lowrance" [ref=e682] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-17-table-rock-lake/
            - text: with a dominant day on Table Rock, Wheeler finally took down the biggest tournament in Major League Fishing.
          - paragraph [ref=e683]: After the dust settled, Wheeler was celebrated at the Champions Toast Presented by Cigars International, where fans, family and his fellow competitors were on hand to congratulate the GOAT.
      - generic [ref=e701]:
        - 'heading "GALLERY: Top 10 pros regale REDCREST fans at postgame show" [level=1] [ref=e702]'
        - heading [level=5]
        - generic [ref=e703]:
          - 'img "Image for GALLERY: Top 10 pros regale REDCREST fans at postgame show" [ref=e704]'
          - generic [ref=e705]:
            - text: April 19, 2026 • Phoenix Moore, Rob Matsuura, Tyler Brinks •
            - link "Bass Pro Tour" [ref=e706] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/bass-pro-tour/
          - paragraph [ref=e707]:
            - text: SPRINGFIELD, Mo. – After a hard-fought day on Table Rock Lake, the Top 10 pros hit the stage to share their
            - link "Bass Pro Shops REDCREST Presented by Mercury & Lowrance" [ref=e708] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-17-table-rock-lake/
            - text: Championship Round experience. While the round was only one day and REDCREST is only three days long, this moment is the culmination of a lifetime of work, sweat and tears, as they and their families poured everything into making their bass fishing dream a reality.
          - paragraph
      - generic [ref=e771]:
        - heading "Wheeler a REDCREST winner at last" [level=1] [ref=e772]
        - heading [level=5]
        - generic [ref=e773]:
          - img "Image for Wheeler a REDCREST winner at last" [ref=e774]
          - generic [ref=e775]:
            - text: "Jacob Wheeler won his first REDCREST title in seven tries on Table Rock Lake. Photo by Rob Matsuura. Angler:"
            - link "Jacob Wheeler" [ref=e776] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/jacob-wheeler/
            - text: .
          - generic [ref=e777]:
            - text: April 19, 2026 • Mitchell Forde •
            - link "Bass Pro Tour" [ref=e778] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/bass-pro-tour/
          - paragraph [ref=e779]:
            - text: SPRINGFIELD, Mo. — With 2 1/2 hours left to fish in
            - link "Bass Pro Shops REDCREST Presented by Mercury & Lowrance" [ref=e780] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-17-table-rock-lake/live/
            - text: ","
            - link "Jacob Wheeler" [ref=e781] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/jacob-wheeler/
            - text: sat on the front deck of his bass boat and made a phone call. Trying to distract himself from the fact that the $300,000 prize and REDCREST trophy that had long eluded him were within reach, Wheeler FaceTimed his wife, Alicia, and their two children, Olivia and Hudson, during the final period break.
          - paragraph [ref=e782]: At that point, Wheeler led his nearest pursuer by more than 17 pounds. With postfrontal conditions making for a tough bite on Table Rock Lake, just about everyone knew that the title that had long seemed inevitable was now imminent – including Olivia. The 7-year-old asked, “Daddy, you’re going to win, right?”
          - paragraph [ref=e783]: “I’m just like, ‘Honey, I’m going to try, but it’s not a guarantee,’” Wheeler said with a laugh. “’It’s OK if I don’t. We’re going to try our hardest.’”
          - paragraph [ref=e784]:
            - text: "Was that Wheeler trying not to get ahead of himself? Sure. But he had good reason not to get too excited. Since winning the Forrest Wood Cup in 2012 at age 21, Wheeler has accomplished just about everything there is to accomplish in tournament bass fishing: 11"
            - link "Bass Pro Tour" [ref=e785] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/circuits/bass-pro-tour/
            - text: wins, a Bassmaster Elite Series win, four Fishing Clash Angler of the Year titles. But despite four top-six finishes, he had yet to win Major League Fishing’s championship event.
          - paragraph [ref=e786]: Sunday, he finally got it done.
          - paragraph [ref=e787]:
            - text: After pulling away from the rest of the Championship Round pros early, Wheeler cruised to a 51-pound, 11-ounce total on 21 scorable bass. That topped runner-up
            - link "Takahiro Omori" [ref=e788] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/takahiro-omori/
            - text: by 13-3 and earned Wheeler the one piece of hardware he’s been missing – the REDCREST trophy.
          - paragraph [ref=e789]: “It’s just been the thorn in my side,” Wheeler said. “I’ve had some really close calls. The ball has not bounced my way in these tournaments.
          - paragraph [ref=e790]: “It means the world. It really does.”
          - paragraph [ref=e791]: "Here’s how the Top 10 pros finished the Championship Round:"
          - list [ref=e792]:
            - listitem [ref=e793]: Jacob Wheeler – 51-11 (21)
            - listitem [ref=e794]: Takahiro Omori – 38-8 (15)
            - listitem [ref=e795]: Zack Birge – 32-15 (12)
            - listitem [ref=e796]: Brent Ehrler – 29-7 (12)
            - listitem [ref=e797]: Drew Gill – 28-1 (12)
            - listitem [ref=e798]: Alton Jones Jr. – 24-14 (9)
            - listitem [ref=e799]: Mark Daniels Jr. – 23-14 (10)
            - listitem [ref=e800]: Spencer Shuffield – 20-9 (8)
            - listitem [ref=e801]: Jeff Sprague – 17-3 (7)
            - listitem [ref=e802]: Dustin Connell – 12-8 (5)
          - paragraph [ref=e803]:
            - link "Full results" [ref=e804] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-17-table-rock-lake/
          - heading "Wheeler separates himself with strategy" [level=3] [ref=e805]
          - figure "Wheeler combined a shallow largemouth bite with targeting spawning smallmouth. Photo by Rob Matsuura" [ref=e806]:
            - generic [ref=e807]: Wheeler combined a shallow largemouth bite with targeting spawning smallmouth. Photo by Rob Matsuura
          - paragraph [ref=e808]: Ever since Table Rock was revealed as the playing field for REDCREST, Wheeler has been eyeing this event – and for good reason. His first career BPT win came on the fishery in 2019.
          - paragraph [ref=e809]: But he didn’t spend more time studying or pre-practicing than he does for any other tournaments. For events that occur around the bass spawn, he thinks doing so is counterproductive.
          - paragraph [ref=e810]: So, instead of out-working the competition, he out-strategized them.
          - paragraph [ref=e811]: “I might not have been on the best fish, but I just played my hand right,” Wheeler said.
          - paragraph [ref=e812]: During practice, Wheeler found a group of prespawn smallmouth at the end of a main-lake point in Long Creek. When he returned there to start Day 1, he discovered a healthy population of spawners, too. He boated 10 scorable bass for 24-4 during the opening hour of the event, taking an early lead. He wound up finishing the day in third with 52-2, which put him 14 pounds clear of the Lucas Oil Cut Line.
          - paragraph [ref=e813]: That strong start afforded Wheeler the luxury of using Day 2 to explore new water. Even though weights zeroed between the Qualifying Round and Championship Round, Wheeler pointed to Saturday as the day he won the event.
          - paragraph [ref=e814]: On Day 2, Wheeler opted to conserve his period with forward-facing sonar until Period 3, using the early hours to expand the shallow largemouth bite he chased without the technology. He found a few productive stretches where he could get bunches of bites on a bladed jig. Then, once he topped the 75-pound mark, he cut off his hooks. Even when he fell to ninth place in the third period, just one spot inside the cut, Wheeler stuck to his strategy, knowing every fish he could save might be crucial. He estimated that half the smallmouth he caught during his big first period of the Championship Round were spawners he pinpointed on Saturday afternoon.
          - paragraph [ref=e815]: “Yesterday, my boat official was like, ‘You’re 4 pounds out from 10th and 11th. Do you maybe want to put a hook on?’” Wheeler said. “I’m like, ‘Nah.’ I was playing it so tight. Yesterday was the day I won this tournament.”
          - heading "Building an insurmountable early lead" [level=3] [ref=e816]
          - figure "Wheeler had more than 20 pounds to his name within the first hour of Championship Sunday. Photo by Phoenix Moore" [ref=e817]:
            - generic [ref=e818]: Wheeler had more than 20 pounds to his name within the first hour of Championship Sunday. Photo by Phoenix Moore
          - paragraph [ref=e819]: Prior to Championship Sunday, Wheeler couldn’t sleep. Once on the water, it didn’t take him long to calm his nerves and claim the top spot on SCORETRACKER®.
          - paragraph [ref=e820]: His first bass of the day, a 4-pounder, gave him the lead 15 minutes after lines in. He never relinquished the top spot. He quickly added seven more scorable bass to bring his total to 20-15 within the first hour.
          - paragraph [ref=e821]: That opening flurry was made possible by the type of breaks that haven’t gone Wheeler’s way in past editions of REDCREST. He hooked and lost the same 4-pounder on Day 1, and some fresh fish that weren’t there Friday moved into the area to spawn.
          - paragraph [ref=e822]: “The one big one I lost on Day 1, that fish was still there, and I ended up catching that one – that was that 4-pounder I caught this morning,” he said. “So, there’s things like that that happened, that was like the grace of God.”
          - paragraph [ref=e823]: From there, Wheeler transitioned to running individual spawners that he’d marked on Day 2. Showcasing his trademark efficiency, he added six more scorable bass for more than 15 pounds, bringing his Period 1 total to 35-11. The second-best single period of any angler throughout the event, that essentially turned the rest of the day into a race for second. He maintained a 10-plus-pound lead until lines out.
          - paragraph [ref=e824]:
            - text: While using his new
            - link "Lowrance ActiveTarget 2 XL" [ref=e825] [cursor=pointer]:
              - /url: https://www.basspro.com/p/lowrance-activetarget-2-xl-transducer
            - text: transducer to target smallmouth, Wheeler utilized the one-two punch of a jighead minnow and a Ned rig. He mixed a 4.25-inch
            - link "Rapala CrushCity Freeloader" [ref=e826] [cursor=pointer]:
              - /url: https://www.basspro.com/p/rapala-crushcity-customs-freeloader
            - text: and a 4.5-inch
            - link "CrushCity Mooch Minnow" [ref=e827] [cursor=pointer]:
              - /url: https://www.basspro.com/p/rapala-crushcity-customs-mooch-minnow
            - text: with a
            - link "CrushCity Salted Ned Roll" [ref=e828] [cursor=pointer]:
              - /url: https://www.basspro.com/p/rapala-crushcity-customs-salted-ned-roll
            - text: . After turning off his transducers and heading to shallower, stained water, he fooled most of his largemouth with a
            - link "Z-Man Evergreen JackHammer ChatterBait" [ref=e829] [cursor=pointer]:
              - /url: https://www.basspro.com/p/z-man-chatterbait-jack-hammer-ever-green-custom-bladed-jig
            - text: paired with a Freeloader in either sungill or green pumpkin magic.
          - paragraph [ref=e830]: Despite his early lead, Wheeler thought he still needed to stack up about 30 pounds of largemouth to finally hoist the trophy. But it didn’t take long to see that the bluebird skies had hampered the shallow bite. The situation was eerily similar to the most recent Bass Pro Tour event – the Championship Round of Stage 4 on Lake Brownwood, a grinder in which Wheeler also grabbed an early lead then held on to win.
          - paragraph [ref=e831]: “That cold front did the same thing it did on Brownwood,” Wheeler said. “Yesterday, they bit. It’s the same exact scenario happened today. First day of the front, they’re OK; they bite still. Second day of the front, it’s like a ghost town.”
          - heading "REDCREST box finally checked" [level=3] [ref=e832]
          - figure "Wheeler dedicated this win to his father, who passed away from cancer shortly before last year’s REDCREST. Photo by Rob Matsuura" [ref=e833]:
            - generic [ref=e834]: Wheeler dedicated this win to his father, who passed away from cancer shortly before last year’s REDCREST. Photo by Rob Matsuura
          - paragraph [ref=e835]: Once his boat official counted down to lines out and the win finally became official, Wheeler let the tears flow. He dedicated the victory to his late father, who died from cancer just a few days before REDCREST 2025.
          - paragraph [ref=e836]: “It was super emotional, because my dad told me he wanted me to win one for him before he passed away, and (not doing so) was just a tough one to swallow,” Wheeler said.
          - paragraph [ref=e837]: But his prevailing emotion was relief. Wheeler can finally stop hearing about how he hasn’t won the big one.
          - paragraph [ref=e838]:
            - text: "“This is the thing: I can brush off a"
            - link "Jake Lawrence" [ref=e839] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/jake-lawrence-500859/
            - text: last-minute buzzer-beater win and placing second (in the regular-season),” Wheeler said. “But you only get once a year to take a crack at this tournament. And so, it just means more.”
          - paragraph [ref=e840]:
            - text: It means more than perhaps any previous win for Wheeler’s résumé, too. He further bolstered his standing as the dominant angler of his era and one of the greatest of all time. Since the inception of the Bass Pro Tour in 2019, he’s up to 12 wins to go along with four Angler of the Year titles. He joins
            - link "Kevin VanDam" [ref=e841] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/kevin-vandam/
            - text: as the only angler ever to win multiple tour championship events and four-plus AOY crowns.
          - paragraph [ref=e842]: In the afterglow of his win, Wheeler wasn’t ready to think about greatest-of-all-time debates. But it’s not lost on him what finally adding a REDCREST trophy to his collection means to his legacy.
          - paragraph [ref=e843]: “Does it define my career? No. I don’t really feel like it does,” Wheeler said. “But it definitely adds an additional layer to it. And that to me is what it’s about. Like, wow, you got it done in the event that you can only fish once a year. And that in and of itself is what I’m so thankful for.”
          - paragraph

          - paragraph [ref=e463]: “I was targeting chunk rock and some wood way up the river,” he said. “I was focusing on spawning pockets that had a secondary point or channel swing. All my fish were in 5 feet of water or less.”
          - paragraph [ref=e464]:
            - text: To catch his fish, Omori relied on a white 3/8-ounce
            - link "Z-Man Evergreen Jack Hammer ChatterBait" [ref=e465] [cursor=pointer]:

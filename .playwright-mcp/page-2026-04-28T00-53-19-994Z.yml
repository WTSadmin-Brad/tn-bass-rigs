          - paragraph [ref=e546]: “I was mainly fishing for spawning fish this week and targeting a little bit steeper banks that had bigger rocks with cracks in them,” he said. “I could get those fish to respond by dragging that crankbait through there, almost like a worm. They would get territorial and come up and respond to it.”

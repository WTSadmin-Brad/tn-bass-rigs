        - heading "Before REDCREST, MLF pros give back with Suzuki Marine lake cleanup at Table Rock Lake" [level=1] [ref=e599]
        - heading "Anglers, volunteers unite for conservation effort at Table Rock Lake State Park Marina" [level=5] [ref=e600]
        - generic [ref=e601]:
          - img "Image for Before REDCREST, MLF pros give back with Suzuki Marine lake cleanup at Table Rock Lake" [ref=e602]
          - generic [ref=e603]:
            - text: April 21, 2026 • MLF •
            - link "Press Releases" [ref=e604] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/press-releases/
          - paragraph [ref=e605]:
            - text: SPRINGFIELD, Mo. – Before the first cast of
            - link "Bass Pro Shops REDCREST 2026 Presented by Mercury Marine and Lowrance" [ref=e606] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-17-table-rock-lake/
            - text: ", a group of Major League Fishing pros traded rods and reels for trash bags, teaming up with Suzuki Marine and H2Ozarks to give back to the fishery that would soon take center stage."
          - paragraph [ref=e607]: On Thursday, April 16, eight MLF Bass Pro Tour anglers – Keith Carson, James Elam, Matt Becker, John Hunter, Nick Hatfield, Jacob Wheeler, Adrian Avena and Dean Rojas – joined approximately 30 volunteers for a shoreline cleanup at Table Rock Lake State Park Marina. The group spent an hour combing the high-traffic public area, each volunteer armed with a bag and a shared goal of leaving the lake better than they found it.
          - paragraph [ref=e608]:
            - link "LINK TO PHOTO GALLERY FROM EVENT" [ref=e609] [cursor=pointer]:
              - /url: https://www.dropbox.com/scl/fo/8ui2gba400mvaqeuyb888/APPTuPZsEyK_cVoiKrKSM-M?rlkey=zly8tpcgskq6aivm945ctlrhs&st=3a3epfk7&dl=0
          - paragraph [ref=e610]: Despite the short timeframe, the impact was immediate. Volunteers filled bags, and even wheelbarrows, with trash collected from the shoreline.
          - paragraph [ref=e611]: “It’s important for us as anglers to give back to the places that give us so much,” said Suzuki Marine pro angler Keith Carson of DeBary, Florida. “We spend our careers on these lakes, and taking a little time to help clean them up and protect them for the future means a lot. It’s also really cool to see everyone come together, especially with kids involved, learning how important it is to take care of our fisheries.”
          - paragraph [ref=e612]: The cleanup effort was part of REDCREST week community outreach, a continued emphasis for MLF to make a positive impact in host communities beyond competition days. Anglers were fully engaged throughout the event, interacting with fans and working alongside volunteers, with several even bringing their children to participate.
          - paragraph [ref=e613]: One of the day’s standout moments came as pro Adrian Avena worked side by side with his son, a powerful reminder of the role today’s anglers play in passing down a passion for conservation to the next generation.
          - paragraph [ref=e614]: The partnership with Suzuki Marine continues to highlight a shared commitment to environmental stewardship. Through initiatives like the Suzuki Marine Lake Cleanup, the organizations aim to support cleaner waterways and healthier fisheries across the country.
          - paragraph [ref=e615]: “We’re proud to partner with Suzuki Marine and H2Ozarks to make a positive impact here at Table Rock Lake,” said Joe Opager, Senior Director of Communications for Major League Fishing. “REDCREST is about showcasing the best anglers in the world, but it’s also about leaving a lasting impression on the communities and fisheries that host us. This was a simple effort, but a meaningful one, and something we’re excited to continue building on.”

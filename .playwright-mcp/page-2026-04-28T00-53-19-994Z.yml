          - paragraph [ref=e450]: Wheeler finally achieved one of the few titles that had eluded him as he took the REDCREST win. He stayed on the lower end of the lake, primarily around Long Creek, targeting bass in all three stages of the spawn. While many anglers gravitated to spawning pockets, he opted to stay away from them.
          - paragraph [ref=e451]: “There was a lot of local tournament pressure, and our guys fishing and everyone would run straight into pockets, so I tried to stay away from them,” he said. “I focused my time and energy on long, drawn-out points on channel swings because there was less pressure. You could also catch prespawn fish, spawning fish, and post-spawners all in the same track because the areas were replenishing.”

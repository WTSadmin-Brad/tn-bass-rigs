      - generic [ref=e342]:
        - heading "Beaver Lake returns to national scene as host of Stage 5" [level=1] [ref=e343]
        - heading [level=5]
        - generic [ref=e344]:
          - img "Image for Beaver Lake returns to national scene as host of Stage 5" [ref=e345]
          - generic [ref=e346]: Arkansas native Greg Bohannan expects all three bass species to show up when the BPT visits Beaver Lake for Stage 5. Photo by D.W. Reed II
          - generic [ref=e347]:
            - text: April 23, 2026 • Mitchell Forde •
            - link "Bass Pro Tour" [ref=e348] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/bass-pro-tour/
          - paragraph [ref=e349]: ROGERS, Ark. — For most of the FLW Tour’s existence, Beaver Lake served as an annual destination. From 1998 through 2017, the Northwest Arkansas reservoir hosted FLW Tour events every year except one (2010). However, since that last visit in April of 2017, no national-level tour has been back to Beaver.
          - paragraph [ref=e350]:
            - text: That will change this year, as the
            - link "Bass Pro Tour" [ref=e351] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/circuits/bass-pro-tour/
            - text: will visit Beaver Lake April 30 through May 3 for
            - link "Yuengling Light Lager Stage 5 Presented by YETI" [ref=e352] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-30-stage-5-beaver-lake/
            - text: . Northwest Arkansas native and longtime former FLW Tour pro
            - link "Greg Bohannan" [ref=e353] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/greg-bohannan-175226/
            - text: thinks the lake is poised to put on a show in its return to the national stage.
          - heading "Another multi-species showdown" [level=3] [ref=e354]
          - figure "Several former FLW Tour pros will visit a familiar fishery at Beaver Lake, including David Dudley, who won there in 2012. Photo by Brett Carlson" [ref=e355]:
            - generic [ref=e356]: Several former FLW Tour pros will visit a familiar fishery at Beaver Lake, including David Dudley, who won there in 2012. Photo by Brett Carlson
          - paragraph [ref=e357]: Many of the FLW Tour stops on Beaver Lake were grinders, with 12 to 15 pounds per day typically earning the win. But between the health of the fishery and the Bass Pro Tour’s every-fish-counts format, Bohannan thinks Stage 5 could be an explosive event.
          - paragraph [ref=e358]: “In my opinion, it’s fishing as good as it ever has in the history of the lake,” he said. “In our old times, if you caught 8 or 9 pounds a day in an FLW event for two days, you’d always get paid. It is not that way anymore. The numbers are good; all three species’ population is really good. And what used to take 12, 13, 14 pounds to win tournaments, it takes 18 to 20 to win team events out here now.”
          - paragraph [ref=e359]: Those numbers represent weights for five-fish limits. This event will be the first top-level tournament on Beaver featuring every-fish-counts scoring, which Bohannan thinks is better suited to show off the fishery.
          - paragraph [ref=e360]:
            - text: Like Table Rock Lake, which is just above Beaver on the White River (and which just hosted
            - link "Bass Pro Shops REDCREST Presented by Mercury & Lowrance" [ref=e361] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-17-table-rock-lake/
            - text: ), Beaver has a population of all three bass species. Bohannan expects to see largemouth, smallmouth and spotted bass all show up on SCORETRACKER®, with most anglers catching a mixture of species.
          - paragraph [ref=e362]: “I think in a BPT event, spotted bass are going to play very heavy just because of the numbers of them,” he said. “But all three species will play. The cool thing about this lake is you can catch all three species all mixed together sometimes.”
          - heading "Key variables to watch" [level=3] [ref=e363]
          - figure "Beaver Lake has been known to flood in the spring, which could change the complexion of Stage 5. Photo by Sean Ostruszka" [ref=e364]:
            - generic [ref=e365]: Beaver Lake has been known to flood in the spring, which could change the complexion of Stage 5. Photo by Sean Ostruszka
          - paragraph [ref=e366]: Anytime an Ozark-area highland reservoir hosts a tournament, the big question mark is water level. Beaver has been known to rise and fall rapidly. Look no further than the last FLW Tour event there for proof – the lake rose about 12 feet from the start of practice to the final day of the event. As of this writing, the lake is close to normal pool, although there is some rain in the forecast prior to the start of the event.
          - paragraph [ref=e367]: While the water level might determine whether the bulk of the field catches fish shallow or deep, Bohannan expects catch rates to be high regardless. He thinks anglers will be targeting a mixture of spawning and postspawn bass, and just about every tactic will be on the table.
          - paragraph [ref=e368]: “I think it’ll be a spawn to postspawn event,” he said. “There will still be a lot of fish spawning that first week of May; there will be a lot of them done. It’s probably going to be just past the meat of the spawn, or just past the highest number of fish being on the bed. But that is an excellent time to catch just a tremendous amount of fish.”
          - paragraph [ref=e369]: With a variety of ways to catch bass, taking advantage of the one period per day in which anglers are allowed to use forward-facing sonar might not exactly be mandatory. But as we just saw at Table Rock, there should be some anglers who put up big numbers during that frame, whether it be targeting spawning fish or postspawners chasing bait offshore.
          - paragraph [ref=e370]: “They’re going to have to take advantage of that,” Bohannan said.
          - paragraph [ref=e371]:
            - text: One other storyline to watch is whether experience on Beaver Lake proves valuable. Several anglers in the field used to visit the lake annually as members of the FLW Tour, and there are two former Beaver winners in this field –
            - link "David Dudley" [ref=e372] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/david-dudley/
            - text: and
            - link "Bryan Thrift" [ref=e373] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/bryan-thrift/https://majorleaguefishing.com/anglers/bryan-thrift/
            - text: .
            - link "Wesley Strader" [ref=e374] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/wesley-strader/
            - text: has fished the most MLF events on Beaver with 20, followed by Dudley at 19 and
            - link "Mark Rose" [ref=e375] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/mark-rose/
            - text: at 18.
          - paragraph [ref=e376]:
            - text: Watch all the action on the
            - emphasis [ref=e377]: MLFNOW!
            - text: livestream from 7:30 a.m. to 4 p.m. CT each day at MajorLeagueFishing.com, the MLF and MyOutdoorTV (MOTV) apps and the Major League Fishing channel on Rumble.
      - generic [ref=e379]:
        - heading "Bass Pro Tour set for debut at Beaver Lake with Yuengling Light Lager Stage 5 Presented by YETI" [level=1] [ref=e380]
        - heading "Rogers set to host 51 pros competing for $600,000 purse on historic Northwest Arkansas fishery" [level=5] [ref=e381]
        - generic [ref=e382]:
          - img "Image for Bass Pro Tour set for debut at Beaver Lake with Yuengling Light Lager Stage 5 Presented by YETI" [ref=e383]
          - generic [ref=e384]:
            - text: April 22, 2026 • MLF •
            - link "Press Releases" [ref=e385] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/press-releases/
          - paragraph [ref=e386]:
            - text: ROGERS, Ark. – The
            - link "Bass Pro Tour" [ref=e387] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/circuits/bass-pro-tour/
            - text: makes its first-ever stop at Beaver Lake next week, April 30 through May 3, as
            - link "Yuengling Light Lager Stage 5 Presented by YETI" [ref=e388] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/events/2026-04-30-stage-5-beaver-lake/
            - text: brings the league’s high-intensity, every-fish-counts format to Northwest Arkansas.
          - paragraph [ref=e389]:
            - text: Hosted by
            - link "Destination Rogers" [ref=e390] [cursor=pointer]:
              - /url: http://www.destinationrogers.com/
            - text: ", the four-day tournament will feature 51 of the world’s top professional anglers competing for a $125,000 top prize and their share of a $600,000 purse, along with valuable Fishing Clash Angler of the Year (AOY) points in hopes of qualifying for REDCREST 2027 – the Bass Pro Tour championship – and the Kubota Heavy Hitters all-star event. Competition will unfold under MLF’s catch, weigh, immediate-release format, where every bass over the 1-pound, 8-ounce minimum counts and SCORETRACKER® – the MLF live leaderboard – keeps the pressure on throughout the day."
          - paragraph [ref=e391]:
            - text: The field brings together a dynamic mix of the Bass Pro Tour’s biggest stars and rising contenders, led by reigning Bass Pro Tour Angler of the Year, 12-time tour winner and REDCREST 2026 champion
            - link "Jacob Wheeler" [ref=e392] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/jacob-wheeler/
            - text: and three-time REDCREST champion
            - link "Dustin Connell" [ref=e393] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/dustin-connell/
            - text: . Proven veterans and fan favorites like
            - link "Edwin Evers" [ref=e394] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/edwin-evers/
            - text: ","
            - link "Ott DeFoe" [ref=e395] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/ott-defoe/
            - text: and
            - link "Zack Birge" [ref=e396] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/zack-birge/
            - text: continue to anchor the roster, bringing both consistency and championship pedigree to every event on the schedule.
          - paragraph [ref=e397]: “Rogers is thrilled to welcome the MLF Bass Pro Tour to Beaver Lake next week,” said J. R. Shaw, Executive Director at Destination Rogers. “Outdoor recreation in Arkansas fuels our state’s economy, and events like this support small businesses and bring great awareness to Rogers and Northwest Arkansas as a premier outdoor recreation destination. Destination Rogers looks forward to partnering with the Major League Fishing staff and community in hosting this prestigious tournament.”
          - paragraph [ref=e398]: The event will mark a significant milestone for the Bass Pro Tour, as Beaver Lake – a longtime staple across MLF (previously FLW) competition – hosts its inaugural BPT event. MLF has previously held 28 tournaments on the fishery, primarily at the Tackle Warehouse Pro Circuit (formerly FLW Tour) and Phoenix Bass Fishing League levels, but Stage 5 introduces a new dynamic with SCORETRACKER® and the tour’s catch, weigh, immediate-release format.
          - paragraph [ref=e399]:
            - text: Bass Pro Tour angler
            - link "Mark Rose of Wynne, Arkansas" [ref=e400] [cursor=pointer]:
              - /url: https://majorleaguefishing.com/anglers/mark-rose/
            - text: ", said Beaver Lake is entering the event in strong shape, and he expects the fishery to show out."
          - paragraph [ref=e401]: “The lake has been fishing really good,” Rose said. “The weights are better than they’ve ever been. Years ago, if you had 10 or 11 pounds at Beaver Lake, you were doing really well in a tournament. Now we’re seeing high teens and beyond – it’s a really healthy fishery.”
          - paragraph [ref=e402]: While all three species of bass are expected to be in play (largemouth, smallmouth and spotted bass) Rose said he believes spotted bass will likely dominate the leaderboard – especially under the BPT’s catch, weigh and immediate-release format.
          - paragraph [ref=e403]: “I think spotted bass are going to be the most dominant species,” Rose explained. “They’re the most abundant in Beaver Lake, and we’re going to see a lot more spots being caught.”
          - paragraph [ref=e404]: As the event lines up with the late spring transition, Rose expects a mix of familiar Ozark patterns, with an emphasis on bank-oriented fishing.
          - paragraph [ref=e405]: “You’re going to see a lot of what we just saw at REDCREST on Table Rock Lake – worms, bottom baits, shaky heads and Ned rigs,” he said. “There will be some fry-guarding fish, maybe a little more topwater starting to come into play, but for the most part it’s going to be pretty standard springtime fishing.”
          - paragraph [ref=e406]: Despite the presence of forward-facing sonar in clear water, Rose doesn’t anticipate it dominating the event.
          - paragraph [ref=e407]: “There’s always going to be a ‘scope bite, but I don’t think it’ll be the overwhelming factor,” Rose said. “With the weather we’ve got coming in – cooler nights and mild days – it’s not really setting up for a big offshore deal. I think a lot of it is still going to happen relating to the bank.”
          - paragraph [ref=e408]: Compared to nearby Table Rock Lake, Rose noted that Beaver’s layout could subtly shift how the event unfolds.
          - paragraph [ref=e409]: “Beaver doesn’t have as much river influence as Table Rock,” he said. “You’ve got some, but not nearly as much stained water options. It’s really just a smaller version overall, but I do think we’ll see a slightly higher catch rate here. REDCREST had a 2-pound minimum, but with the 1-pound, 8-ounce minimum on Beaver Lake, that extra half-pound is going to make a difference, especially with spotted bass.”
          - paragraph [ref=e410]:
            - text: Anglers will arrive each morning at 6:15 a.m. CT to Prairie Creek Recreation Area, located at 9314 N. Park Road in Rogers, Arkansas. Anglers will return to Prairie Creek Recreation Area each evening following the end of competition at 3:45 p.m. Fans are welcome to attend all launch and takeout events and also encouraged to watch the event live online throughout the day on the
            - emphasis [ref=e411]: MLFNOW!
            - text: livestream and follow along with SCORETRACKER® coverage at
            - link "MajorLeagueFishing.com" [ref=e412] [cursor=pointer]:
              - /url: http://www.majorleaguefishing.com/
            - text: .
          - paragraph [ref=e413]:
            - text: On Saturday and Sunday, May 2-3, from 3-6 p.m., MLF invites fans of all ages to Bass Pro Shops located at 2300 S. Promenade Boulevard in Rogers, for the
            - strong [ref=e414]: MLF Fan Experience & Watch Party
            - text: . Fans can watch the Bass Pro Tour pros live on the
            - emphasis [ref=e415]: MLFNOW!
            - text: big screen, enjoy free food for the first 100 fans each day, enter hourly giveaways, browse MLF merchandise and the bargain bait bin, participate in a casting contest and cheer on their favorite anglers. Live music begins at 4 p.m., followed by Top 10 angler interviews and the trophy presentation at 5 p.m., including autographs and photos with Bass Pro Tour finalists. The first 50 kids ages 14 and under will receive a free rod and reel each day.
          - paragraph [ref=e416]:
            - text: Student anglers from sixth grade through college are invited to join MLF pros at the free Columbia PFG Student Angler Clinic on Saturday, May 2 from 2-6 p.m. The clinic will also be held at Bass Pro Shops, located at 2300 S. Promenade Boulevard in Rogers, and offers a unique opportunity for students to learn from Bass Pro Tour pros, gain hands-on fishing instruction and compete in the national MLF Casting Competition. For more information or to register to the Columbia PFG Student Angler Clinic, visit
            - link "MajorLeagueFishing.com" [ref=e417] [cursor=pointer]:
              - /url: https://forms.majorleaguefishing.com/form-6915369/columbia-pfg-student-angler-clinic
            - text: .
          - paragraph [ref=e418]: Yuengling Light Lager Stage 5 at Beaver Lake Presented by YETI will feature anglers competing with a 1-pound, 8-ounce minimum weight requirement for a bass to be deemed scorable. The MLF Fisheries Management Division determines minimum weights for each body of water that the Bass Pro Tour visits, based on the productivity, bass population and anticipated average size of fish in each fishery.
          - paragraph [ref=e419]: The 2026 Bass Pro Tour features a field of 51 of the best professional anglers in the world, competing across seven regular-season tournaments around the country for millions of dollars and valuable points to qualify for the annual Heavy Hitters all-star event and the REDCREST 2027 championship.
          - paragraph [ref=e420]: The full field of anglers will compete in the two-day Qualifying Round on Thursday and Friday. After the two-day Qualifying Round is complete, the pro with the heaviest two-day total will advance directly to Sunday’s Championship Round. Anglers who finish second through 25th will advance to Saturday’s Knockout Round. In the Knockout Round, weights are zeroed, and the remaining anglers compete to finish in the top nine to advance to Sunday’s Championship Round. In the final-day Championship Round, weights are zeroed, and the highest one-day total wins the top prize of $125,000.
          - paragraph [ref=e421]:
            - text: The
            - emphasis [ref=e422]: MLFNOW!
            - text: broadcast team of Chad McKee and J.T. Kenney will break down the extended action live on all four days of competition from 7:30 a.m. to 4 p.m. CT.

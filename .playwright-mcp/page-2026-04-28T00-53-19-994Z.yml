            - text: ", the MyOutdoorTV (MOTV) app and Rumble."
          - paragraph [ref=e425]: Television coverage of the Yuengling Light Lager Stage 5 at Beaver Lake Presented by YETI will premiere as a two-hour episode starting at 7 a.m. ET, on Saturday, Sept. 19 on Discovery. New MLF episodes premiere each Saturday morning on Discovery, with re-airings on Outdoor Channel.
          - paragraph [ref=e426]: "Proud sponsors of the MLF Bass Pro Tour include: Abu Garcia, Athletic Brewing Co., Bass Force, B&W Trailer Hitches, Bass Force, Bass Pro Shops, Berkley, Black Buffalo, BUBBA, Cigars International, Epic Baits, Fishing Clash, Grizzly, Lowrance, Mercury, MillerTech, NITRO Boats, OFF! Deep Woods, O’Reilly Auto Parts, Power-Pole, Ranger Boats, Rapala, Star brite, Suzuki Marine, Toyota, Yuengling and Zenni."

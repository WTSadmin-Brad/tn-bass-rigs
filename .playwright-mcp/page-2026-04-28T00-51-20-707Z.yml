              - generic [ref=e481]: Williams was featured in a 1983 edition of Bassmaster magazine, along with B.A.S.S. president Ray Scott and Arthur Bronson, founder of the International Federation of Black Bass Anglers (IFBBA).
            - paragraph [ref=e482]: While racial inequality was still prevalent in the ’70s and ’80s, Williams said he and Gracie found not only acceptance but respect, friendship and camaraderie in the bass-fishing community from day one, and the couple has never dealt with any open racial discrimination over the nearly 50 years he’s been in the sport.

            - generic [ref=e421]:
              - text: "Mississippi angler Alfred Williams’ childhood passion for fishing led to a lifelong tournament career and a role as an admired leader in the bass-fishing community. Photo by Kory Savage. Angler:"
              - link "Alfred Williams" [ref=e422] [cursor=pointer]:

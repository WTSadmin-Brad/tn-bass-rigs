              - text: eclipsed the 100-tournament mark with MLF in under 10 years of fishing with FLW/MLF – and the results over that span have been stellar. Becker won Angler of the Year and Rookie of the Year in his first year on the Bass Pro Tour after a handful of terrific years on the Tackle Warehouse Pro Circuit and a stout track record at the regional and grassroots levels.
            - heading "Michael Hall" [level=3] [ref=e278]

          - heading "Summertime is the right time for “Big Show” Scroggins’ crab leg creation" [level=1] [ref=e563]
          - heading [level=5]
          - generic [ref=e564]:
            - img "Image for Summertime is the right time for “Big Show” Scroggins’ crab leg creation" [ref=e565]
            - generic [ref=e566]:
              - text: July 25, 2023 • Alan McGuckin •
              - link "Angler News" [ref=e567] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/angler-news/
            - paragraph [ref=e568]:
              - text: Professional bass fishing is a game of tough-to-control uncertainties, but one thing’s for sure, if you show up to Team Toyota’s
              - link "Terry “Big Show” Scroggins’" [ref=e569] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/terry-scroggins/
              - text: house, you’re going to share great food and a ton of laughs.
            - paragraph [ref=e570]: His latest kitchen creation is perfect for summer and was born out of a night at home with buddies Allen Anderson and Tom Willis, who worked as a chef in Denver, before returning recently to his native Florida.
            - paragraph [ref=e571]: “Chef Willis asked me if those oranges on the trees in my yard were any good and if I had any crab legs,” Scroggins said. “Sure enough, I had some crab legs in my freezer, and those oranges in my yard are dang good, so all we needed was some white wine, which I had too. The next thing you know, he’s showing me this awesome way to make crab legs for a crew of hungry guests.”
            - paragraph [ref=e572]: Scroggins and Chef Willis recommend using a deep fry pan, large enough to hold three or four clusters of crab legs, along with three oranges cut in half, and about an inch-deep bath of white wine. Squeeze all the juice from the orange halves into the wine, and then let the orange halves bathe with the crab legs in the wine on a stovetop for 10 minutes on medium to high heat.
            - figure [ref=e574]
            - paragraph [ref=e575]: “I think the citric acid helps soften the spiny shells so you can crack into them easier, and once they’ve cooked for 10 minutes, all you have to do is set them out on a big tray, sprinkle ‘em with a good dash of Old Bay seasoning, and you’ve got a super easy meal that folks can walk past, grab a leg, and have some great summer food while they’re at your pool or picnic,” Scroggins said.
            - paragraph [ref=e576]: “Big Show” likes king crabs best, but says their spiny legs make them a little more challenging to eat than snow crab, and adds that as far as what white wine you choose, it really doesn’t matter.
            - paragraph [ref=e577]:
              - text: He will be choosy next week at Saginaw Bay, Michigan, during
              - link "Bass Pro Tour Stage Seven" [ref=e578] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/events/2023-bass-pro-tour-stage-seven/
              - text: as he looks to notch his fourth Top 5 finish in recent months of MLF events. For example, when he finished fifth at St. Clair last month, he felt using a smaller 3.6-inch MaxScent Flat Worm got him more bites than a slightly larger 4.25-inch version.
            - paragraph [ref=e579]: "But when it comes to cooking up a fast and easy fun meal in the heat of summer, keep it simple. You only need four ingredients: crab legs, white wine, Old Bay seasoning, and some oranges. And if you happen to have them growing on the trees in your yard like “Big Show” does, that makes it even easier."

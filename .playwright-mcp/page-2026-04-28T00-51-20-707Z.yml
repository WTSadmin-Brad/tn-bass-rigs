              - text: .
            - generic [ref=e423]:
              - text: May 9, 2024 • Charity Muehlenweg •
              - link "Angler News" [ref=e424] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/angler-news/
            - paragraph [ref=e425]: It’s early summer of 1953, and Saturday mornings can’t come fast enough for Alfred Williams. Every Saturday morning, 6-year-old Williams wakes up early and mills around the house, hoping for an invite on a fishing adventure with Grandma. He’s in charge of carrying her bucket and keeping the snakes away during their outing, a big job for such a little guy.
            - paragraph [ref=e426]: “Grandma smoked a pipe, and she’d get that pipe lit and settled in the corner of her mouth and sit so quiet…and so content…and I’d just watch her,” Williams said. “I wasn’t fishing much back in those days; I was just watching. Waiting. Learning.”
            - separator [ref=e427]
            - heading "Those tranquil moments would prove pivotal for Williams as he learned to navigate an uncertain world with quiet grace and got his first glimpse into a sport he would grow to love for the next 70 years." [level=2] [ref=e429]:
              - strong [ref=e430]:
                - emphasis [ref=e431]: Those tranquil moments would prove pivotal for Williams as he learned to navigate an uncertain world with quiet grace and got his first glimpse into a sport he would grow to love for the next 70 years.
            - separator [ref=e432]
            - paragraph [ref=e433]:
              - link "Alfred Williams" [ref=e434] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/alfred-williams-103457/
              - text: was born on April 9, 1947, in Jackson, Mississippi, where he spent his youth with a cane pole in hand, casting along the banks of the Pearl River with friends and family.
            - paragraph [ref=e435]: “Fishing was a way to bring people together in a time of racial tension,” Williams said. “There were groups of every race fishing down on the river. We always had a good time, but we weren’t fishing for sport – we were fishing to put food on the table.”
            - paragraph [ref=e436]: But the hook had been set. By the age of 10, Williams was fishing anywhere and everywhere he could with anyone who would take him. By 14, Williams could often be seen on the banks of the Pearl River, alone or with friends.
            - figure "Williams discusses his catch with celebrity guest Roland Martin in 1987 after leading day one of the Rogers-Dingus Barnett Open bass tournament." [ref=e437]:
              - button "Enlarge" [ref=e438] [cursor=pointer]:
                - img [ref=e439]
              - generic [ref=e441]: Williams discusses his catch with celebrity guest Roland Martin in 1987 after leading day one of the Rogers-Dingus Barnett Open bass tournament.
            - paragraph [ref=e442]:
              - text: Young Williams had no idea that he was embarking on a journey that would see him become the first African American to qualify for the Bassmaster Classic in 1983, and a lifetime later in 2024, the first African American to be inducted into the
              - link "Bass Fishing Hall of Fame" [ref=e443] [cursor=pointer]:
                - /url: https://www.bassfishinghof.com/inductee/alfred-williams
              - text: .
            - paragraph [ref=e444]: In March of 1970, Williams returned from a tour of duty in Vietnam at the age of 23. After three long years in the military without touching a rod, he immediately hopped on a boat to go crappie fishing with a friend and felt the excitement course through his veins as his love for the sport came rushing back.
            - paragraph [ref=e445]: That was it for Williams. He bought a little boat with a 50-horsepower outboard and spent the next three years bass fishing every chance he could get. In 1973, he strolled into a Woolco department store and bought a Raycraft bass boat for $529.
            - paragraph [ref=e446]: “I couldn’t get that boat on the water fast enough,” Williams said. “I brought it back home, took the motor off the little runabout boat I had and put it on the bass boat. We picked the boat up from Woolco at 9 a.m. and were out on the Ross Barnett Reservoir by 2 p.m. that afternoon.”
            - separator [ref=e447]
            - heading "Williams fished his first local bass tournament in 1975 in Jackson, Mississippi, in the beginning of the post-Civil Rights Movement era." [level=2] [ref=e449]:
              - strong [ref=e450]:
                - emphasis [ref=e451]: Williams fished his first local bass tournament in 1975 in Jackson, Mississippi, in the beginning of the post-Civil Rights Movement era.
            - separator [ref=e452]
            - paragraph [ref=e453]: Although racial desegregation had been mandated by federal law and court rulings in the 1950s and 60s, the process of integration was extremely slow and, in many cases, painful. Barriers between races continued to exist across the South, especially in Jackson.
            - paragraph [ref=e454]: “I went into a store and saw an application for the Have a Heart Bass Classic, and I really wanted to fish that tournament,” Williams explained. “So, I looked over the application and thought about it for a while, then called the number to talk to the tournament director.
            - figure "Williams shows off his trophy after winning $20,000 cash and a new Ranger 519VS Comanche bass boat in 2003 as the winner of the FLW EverStart Series Central Division season opener on Sam Rayburn Reservoir. Photo by Jeff Schroeder" [ref=e455]:
              - generic [ref=e456]:
                - strong [ref=e457]
                - text: Williams shows off his trophy after winning $20,000 cash and a new Ranger 519VS Comanche bass boat in 2003 as the winner of the FLW EverStart Series Central Division season opener on Sam Rayburn Reservoir. Photo by Jeff Schroeder
            - paragraph [ref=e458]: “I said, ‘Listen, I’m calling about this tournament and I really want to fish this event,’ and he said they’d be happy to have me. I said, ‘Well, look, I’m Black – do you guys have any problems with me fishing this event?’
            - paragraph [ref=e459]: While African American citizens and athletes had begun breaking down racial barriers by 1975, African American athletes had been largely excluded from full participation in most professional sports, relegating them to compete in segregated leagues, which offered lower pay and less visibility than the pro leagues.
            - paragraph [ref=e460]: “I won’t ever forget his response,” Williams said. “He said, ‘You are absolutely welcome. This tournament is for the Heart Association and it’s for everybody. If you want to fish it, send your application in, and if anybody says anything to you about fishing it, you call me. We want you to fish.’
            - paragraph [ref=e461]: “If he’d wavered or said it might be a problem, I wasn’t going to worry about it, I just wasn’t going to fish it. But he assured me that we were more than welcome.”
            - paragraph [ref=e462]: Williams filled out his application and mailed it in along with his entry fee.
            - paragraph [ref=e463]: Although Williams speaks about the racial inequality of those times with grace, his first brush with the world of tournament bass fishing was around the same timeframe that Hank Aaron broke Babe Ruth’s home run record (1974) and received hundreds of thousands of hate mail letters and death threats for beating a white man’s mark. It was also around the same time as the assassinations of Martin Luther King Jr. in 1968 and his mother, Alberta King, in 1974.
            - paragraph [ref=e464]: “We were a little nervous about it all,” Williams admitted. “My wife, Gracie, and I were raised in the South and just knew how things were back then. But just hearing the tournament director say how glad they would be for us to come eased our nerves a bit.”
            - paragraph [ref=e465]: Williams excitedly rigged his tackle and got geared up for his first tournament, then he and Gracie dressed to the nines and headed to the pre-tournament banquet.
            - paragraph [ref=e466]: “Back then, there was a banquet the night before every tournament, and those banquets were huge social gatherings,” Williams said. “We walked into our first banquet at this fancy, exclusive restaurant – there must have been 400 to 500 people in there – and when we walked through the door, you could have heard a pin drop. Everyone stopped what they were doing and just stared at us. We looked around and saw an empty table and found a seat.”
            - separator [ref=e467]
            - heading "What happened next was a pivotal moment for Williams and his wife, Gracie, and is still a pivotal moment in the history of bass fishing." [level=2] [ref=e469]:
              - strong [ref=e470]:
                - emphasis [ref=e471]: What happened next was a pivotal moment for Williams and his wife, Gracie, and is still a pivotal moment in the history of bass fishing.
            - separator [ref=e472]
            - paragraph [ref=e473]: “We had barely gotten seated when a well-dressed white gentleman walked up to our table,” Williams said. “We watched him approach with a little apprehension, and he said, ‘You don’t know me, but I see you catching fish behind my house out on the [Ross Barnett] reservoir all the time. My wife and I would be honored if y’all would come over and sit at our table and have dinner with us.’ And of course we did, and that broke the ice.
            - paragraph [ref=e474]: “He was the general manager for a well-known car dealer and was on television commercials and well respected. Everyone in the room went back to talking and socializing, and from that day on, he and I were really, really good friends up until he passed away.”
            - paragraph [ref=e475]: Williams drew avid hunter, fisherman and NFL running back Perry Lee Dunn in that first event, finishing 33rd, only a few places from making a check.
            - paragraph [ref=e476]: “That was my first tournament, and my first response from the bass-fishing community, and I was absolutely hooked,” Williams said. “I’d proven myself and shown that I knew what I was doing, and I couldn’t wait to get back out there for the next tournament a couple weeks later.”
            - figure "Williams was featured in a 1983 edition of Bassmaster magazine, along with B.A.S.S. president Ray Scott and Arthur Bronson, founder of the International Federation of Black Bass Anglers (IFBBA)." [ref=e477]:
              - button "Enlarge" [ref=e478] [cursor=pointer]:

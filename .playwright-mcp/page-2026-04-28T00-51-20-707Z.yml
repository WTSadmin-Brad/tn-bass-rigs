            - paragraph [ref=e271]: The Century Club, which began in 2024 as a way for Major League Fishing to recognize and thank anglers who have fished 100 or more tournaments with MLF and its predecessors (FLW and Operation Bass), added 57 new members to its ranks in 2025. The total now stands at north of 1,200 members, dating back to the beginning of digital recordkeeping in 1994.
            - paragraph [ref=e272]: This week, we’re highlighting four more members of the Century Club. All four spent at least a few years (and as many as 27!) fishing the FLW Tour/Pro Circuit – one of whom has made quite a mark on the Bass Pro Tour in recent years.
            - heading "Matt Becker" [level=3] [ref=e273]

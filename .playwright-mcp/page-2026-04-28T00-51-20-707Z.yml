        - generic [ref=e132]:
          - heading "A Morning with Wesley Strader on Watts Bar Lake" [level=1] [ref=e133]
          - heading [level=5]
          - generic [ref=e134]:
            - img "Image for A Morning with Wesley Strader on Watts Bar Lake" [ref=e135]
            - generic [ref=e136]: Tales from a morning spent with Wesley Strader on his home lake of Watts Bar Reservoir. Photo by Mason Prince
            - generic [ref=e137]:
              - text: October 2, 2019 • Mason Prince •
              - link "Angler News" [ref=e138] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/angler-news/
            - paragraph [ref=e139]: WATTS BAR, Tenn. – After feasting on a boil of Gulf shrimp, sausage, corn and potatoes provided by Brandon Coulter the night before, Wesley Strader and I are well rested before our excursion on Watts Bar Lake in east Tennessee. Strader grew up fishing on Watts Bar and had plenty of stories to tell and knowledge to share about the reservoir, which is the reservoir above Lake Chickamauga on the Tennessee River.
            - paragraph [ref=e140]:
              - strong [ref=e141]: 7:15 a.m. ET
              - text: – I meet Strader on a dock just outside of his buddy Coulter’s house. The weather is beautiful with not a cloud in the sky as we prepare for a morning of fishing. Strader feels confident that he’ll have success today. “I caught a 4-pounder here yesterday, so I have some good spots in mind,” he boasts.
            - figure "Strader checks his Lowrance unit for signs of activity. Photo by Mason Prince" [ref=e142]:
              - generic [ref=e143]: Strader checks his Lowrance unit for signs of activity. Photo by Mason Prince
            - paragraph [ref=e144]:
              - strong [ref=e145]: 7:20 a.m. ET
              - text: – We arrive at our first location and Strader begins by throwing a Zorro Buzzbait with a
              - link "Zoom Horny Toad trailer (opens in a new tab)" [ref=e146] [cursor=pointer]:
                - /url: https://www.basspro.com/shop/en/zoom-horny-toad
                - text: Zoom Horny Toad trailer
              - text: . I notice how impressively far his casting distance is and he simply says, “Brakes are for sissies.” We have a laugh and he explains that his wrists are actually starting to hurt after a strenuous Bass Pro Tour season.
            - paragraph [ref=e147]:
              - strong [ref=e148]: 8:00 a.m. ET
              - text: – With not much luck on our first stop, we make the move to a spot with a little bit of sentimental value for Strader. He pulls up to a point along the bank and says that this is where he caught his first fish, a 2-pound, 6-ounce bass that his dad had mounted for him when he was just a kid. He says the lake has changed a lot since then.
            - paragraph [ref=e149]:
              - strong [ref=e150]: 8:11 a.m. ET
              - text: – Strader begins to tell me how the Tennessee Valley Authority killed off a lot of the hydrilla in the 1990s, causing the fishing to take a serious hit. The Tennessee native recalls swimming in the lake as a teenager and watching the TVA dump grass-killing chemicals into the water. It’s been almost 30 years since then, and Strader says that Watts Bar is finally starting to come back as one of the best fishing lakes in the state.
            - paragraph [ref=e151]:
              - strong [ref=e152]: 8:45 a.m. ET
              - text: – It takes a little while but we finally have our first fish of the day. Strader has switched up to a vibrating jig to catch this bass, but it doesn’t look to be scoreable. “I don’t really care how big he was, I’m just excited to get a bite,” Strader jokes.
            - figure "Strader with a drum he caught using a vibrating jig. Photo by Mason Prince" [ref=e153]:
              - generic [ref=e154]: Strader with a drum he caught using a vibrating jig. Photo by Mason Prince
            - paragraph [ref=e155]:
              - strong [ref=e156]: 9:30 a.m. ET
              - text: – Still working the vibrating jig, Strader sets the hook and exclaims, “Oh I got a big one!” I step toward the front of the boat to get a picture. As the line gets shorter and the fight gets tougher, Strader begins to think he doesn’t have a largemouth on the other end of that line. “It’s got to be a drum,” he sighs. He’s right.
            - paragraph [ref=e157]:
              - strong [ref=e158]: 9:47 a.m. ET
              - text: – After using a buzzbait or a vibrating jig all morning, Strader reaches for something else as he spies some schooling shad near the surface. He quickly ties on a PH Custom Lures P1 crankbait and casts near the boiling shad. Sadly, no luck. He says that he made the quick change because he had missed one on his vibrating jig and he believed that with more hooks on the crankbait, he would have a better shot at getting one hooked.
            - paragraph [ref=e159]:
              - strong [ref=e160]: 10:11 a.m. ET
              - text: – Strader works his way around some boat docks. “I saw some minnows underneath this dock,” he says. “Docks are great this time of year because they provide shade for the minnows and the bass just love to hang out there.” He picks up his 4 1/4-inch green pumpkin
              - link "Zoom Salty Super Tube (opens in a new tab)" [ref=e161] [cursor=pointer]:
                - /url: https://www.basspro.com/shop/en/zoom-salty-super-tube
                - text: Zoom Salty Super Tube
              - text: to pitch in between the submerged wooden planks.
            - figure "Strader shows off his Zoom Salty Super Tube that he likes to pitch under docks in the fall. Photo by Mason Prince" [ref=e162]:
              - generic [ref=e163]: Strader shows off his Zoom Salty Super Tube that he likes to pitch under docks in the fall. Photo by Mason Prince
            - paragraph [ref=e164]:
              - strong [ref=e165]: 10:49 a.m. ET
              - text: – Our time and luck are beginning to run out. We’re scheduled to head back in at 11 and so far all we’ve gotten are a small bass and a drum, or “vermin of the shallows” as Strader so affectionately puts it. He’d confounded as to why he hasn’t gotten many bites today. As we prepare to head back to the dock, Strader tells me even after a rough day, his confidence in Watts Bar never waivers.
            - paragraph [ref=e166]:
              - text: “I don’t think, I
              - emphasis [ref=e167]: know
              - text: that Watts Bar Lake is about to be the new Lake Chickamauga in about five years,” Strader predicts. “The combination of the grass coming back that was killed off 30 years ago, plus the influx of Florida strain largemouths will make Watts Bar a go-to lake in Tennessee. I can’t wait to see what the future holds for it. Maybe we’ll see an MLF event here one day.”
        - generic [ref=e169]:
          - heading "Alton Jones announces plan to retire following 2026 season" [level=1] [ref=e170]
          - heading [level=5]
          - generic [ref=e171]:
            - img "Image for Alton Jones announces plan to retire following 2026 season" [ref=e172]
            - generic [ref=e173]: Bass Pro Tour angler Alton Jones announced that his 36th season as a touring pro will be his last. Photo by Tyler Brinks.
            - generic [ref=e174]:
              - text: January 15, 2026 • Mitchell Forde •
              - link "Bass Pro Tour" [ref=e175] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/bass-pro-tour/
            - paragraph [ref=e176]:
              - text: Just before the start of his 36th season as a touring pro,
              - link "Alton Jones" [ref=e177] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/alton-jones/
              - text: announced that it will be his last. Jones, who is part of the field that blasted off for the first event of the
              - link "Bass Pro Tour" [ref=e178] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/circuits/bass-pro-tour/
              - text: season on
              - link "Lake Guntersville" [ref=e179] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/events/2026-01-15-stage-1-lake-guntersville/
              - text: Thursday morning,
              - link "posted on his social media accounts" [ref=e180] [cursor=pointer]:
                - /url: https://www.instagram.com/p/DTg4fTyCQiX/
              - text: Wednesday that he will retire at the conclusion of the 2026 season.
            - paragraph [ref=e181]: Speaking to MajorLeagueFishing.com about his decision last week, Jones said retiring isn’t something he took lightly, nor is it a recent development. The 62-year-old has been thinking about it for a while now and eyeing this season as his last for more than a year.
            - paragraph [ref=e182]: “I wanted to fish through the ‘25 season, the whole thing, and I wanted to get to right now and ask myself, ‘OK, this is my last season, how does it feel?’” Jones said. “And it really feels like the right thing to do. I feel a lot of green lights.”
            - heading "A career centered on family" [level=3] [ref=e183]
            - figure "Alton Jones’ family has long accompanied him on the road, both when his wife homeschooled his two kids and once his son, Alton Jones Jr., joined him on tour. Photo by Phoenix Moore" [ref=e184]:
              - generic [ref=e185]: Alton Jones’ family has long accompanied him on the road, both when his wife homeschooled his two kids and once his son, Alton Jones Jr., joined him on tour. Photo by Phoenix Moore
            - paragraph [ref=e186]: Across his long career, Jones has put together one of the most impressive résumés in tournament bass fishing history. He won the 2008 Bassmaster Classic, one of his seven tour-level victories, and has surpassed the $3 million mark in earnings. The Texan also won the 2021 Heavy Hitters event in Raleigh, North Carolina, and finished third in the Angler of the Year standings on the Bass Pro Tour in 2022. While his skillset is versatile, he’s widely considered one of the best sight-fishermen of all time.
            - paragraph [ref=e187]: But looking back across more than three decades of touring competition, Jones said those on-water accolades are “probably the least important thing to me.” The thing he’s treasured most, he said, are the relationships he’s formed with people he’s met along the way.
            - paragraph [ref=e188]: The most important of those relationships have been with his family, which has long been an inextricable part of his pro career. Jones’ wife, Jimmye Sue, and his two children traveled with him on tour for years, with Jimmye Sue homeschooling their kids. Of everything he’s done in the past 36 years, Jones said he’s most proud that they were able to make that work so he didn’t have to leave his family for weeks at a time.
            - paragraph [ref=e189]: “It was a lot of extra work, but an investment that was well worth it as far as our family relationships and preparing them for their futures,” he said. “For us, home became wherever we were together, which was all over the country. It wasn’t anything about a house in Waco, Texas.”
            - paragraph [ref=e190]:
              - text: That family dynamic has continued in recent years as Jones’ son,
              - link "Alton Jones Jr." [ref=e191] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/alton-jones-jr/
              - text: ", has traveled alongside his father while the two compete on the Bass Pro Tour together. They even teamed up for two"
              - link "Fishing Clash Team Series" [ref=e192] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/circuits/team-series/
              - text: events, including a win at the Summit Cup on the St. Clair River last August.
            - paragraph [ref=e193]: “I’ve really treasured the time he and I have gotten to spend together competing against each other on the Bass Pro Tour,” Jones said of his son. “Following each other up and down the roads across America, staying with each other at the venues, strategizing about plans, I’ve enjoyed the relationship-building aspect of that.”
            - heading "Excited to be grandpa" [level=3] [ref=e194]
            - figure "Jones still plans to spend plenty of time on the water during retirement, just not as far away from his Texas home. Photo by Phoenix Moore" [ref=e195]:
              - generic [ref=e196]: Jones still plans to spend plenty of time on the water during retirement, just not as far away from his Texas home. Photo by Phoenix Moore
            - paragraph [ref=e197]: Several factors weighed into Jones’ decision to make 2026 his final year. For one, he said that, while he still loves to fish as much as he ever has, “I’m less mad at the fish than I used to be.” He pointed to that as one reason his results have slipped a bit the past couple years, when he failed to qualify for REDCREST after doing so each of the four previous seasons
            - paragraph [ref=e198]: “For most of my career, if I needed to make a 20-mile run through rough water to get one extra bite, I’m like, ‘Yeah, let’s do this,’” he said. “At 62, I’m like, ‘You know what, I think I’ll just stay where I am and hope one bites.’”
            - paragraph [ref=e199]: Still, Jones plans to spend plenty of time on the water during retirement. Through the years, he’s gained access to “some really fabulous, highly-managed private fisheries.” He’s excited to get more time to fish them, especially during the spring, when he’s usually on the road.
            - paragraph [ref=e200]: “I get to take friends out there, and they’re a great way to develop relationships,” Jones said. “Some of (the fisheries) are so good, it does make it a little bit harder to say, hey, I want to go fish on Lake Waco today when I could go fish over here and I know I’m going to catch 40 fish over 5 pounds. So, I’m going to do a lot of that.”
            - paragraph [ref=e201]: He’s also excited about getting some time back to play pickleball, pursue some additional ministry opportunities and spend time with Jimmye Sue.
            - paragraph [ref=e202]: “While we’re still in good enough health to go do some fun things and spend a lot of quality time together, we want to go do that,” he said.
            - paragraph [ref=e203]: But more than any of those reasons, Jones doesn’t want to be away from home as often because he’s found a role he loves even more than being a professional angler – being grandpa.
            - paragraph [ref=e204]: “We now have four grandchildren under the age of 3, and they all live within 10 minutes of my house,” he said. “And so that makes it harder and harder to leave for weeks at a time to go to tournaments, because you’ve always got that pull of those grandkids there.
            - paragraph [ref=e205]: “I just want to spend a lot of time being grandpa.”
            - heading "Sprinting to the finish line" [level=3] [ref=e206]
            - figure "Jones’ last solo win came at Heavy Hitters in 2021. He’s hoping to add one more trophy before he retires. Photo by Garrick Dixon" [ref=e207]:
              - generic [ref=e208]: Jones’ last solo win came at Heavy Hitters in 2021. He’s hoping to add one more trophy before he retires. Photo by Garrick Dixon
            - paragraph [ref=e209]: Just because Jones has made the decision that this season will be his last, don’t expect him to go through the motions in 2026. He emphasized that his drive to win is as strong as ever, and he still hopes to qualify for two Team Series events next fall as well REDCREST and Heavy Hitters in 2027
            - paragraph [ref=e210]: “I’m approaching this final season not as ‘hey, let’s coast to the finish line,’” he said. “I want to sprint. My preparation, I think, is good. My drive is high. In some ways, I think it maybe even has ratcheted up my work ethic a little bit.”
            - paragraph [ref=e211]: Adding to Jones’ motivation is the fact that this season’s schedule includes several events that excite him – most notably, the first tournament in his long career on fisheries that are local to him, Stage 3 on Lakes Waco and Whitney. He’ll also revisit the site of his Classic win at Stage 2 on Lake Hartwell.
            - paragraph [ref=e212]: “This is sort of a God wink, I guess you could say,” Jones said. “I’ve fished my whole career, I’ve never had a professional tournament that I got to spend the night in my own bed at home and fish that tournament. And this year, we’ve got one. So, that’s really cool.”
            - paragraph [ref=e213]: Jones will try to add one more trophy to his collection and treasure one last season traveling with his son in 2026. Just as much as the hardware he’s won and the relationships he formed, he expressed gratitude that he was able to make such a long career out of something he loves, and that he gets to end it on his terms.
            - paragraph [ref=e214]: “I’m thankful that I’ve been able to have a successful career in bass fishing,” Jones said. “To be able to have this as a job, I really don’t feel like I’ve ever had a job. I’ve worked really hard at it, but it hasn’t been laborious. It’s been hard, it’s been all those type of things, but when you’re working hard at things you love and you’re passionate about, it’s not a job. So, I just feel very blessed and very thankful to have that as part of my story.”
        - generic [ref=e216]:
          - heading "Forrest Wood Cup champion Dion Hibdon dies at 58" [level=1] [ref=e217]
          - heading [level=5]
          - generic [ref=e218]:
            - img "Image for Forrest Wood Cup champion Dion Hibdon dies at 58" [ref=e219]
            - generic [ref=e220]: Dion Hibdon, winner of the 1997 Bassmaster Classic and 2000 Forrest Wood Cup, died Monday. Photo by Rob Matsuura.
            - generic [ref=e221]:
              - text: January 13, 2026 • Mitchell Forde •
              - link "Angler News" [ref=e222] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/angler-news/
            - paragraph [ref=e223]:
              - text: Former Forrest Wood Cup and Bassmaster Classic champion
              - link "Dion Hibdon" [ref=e224] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/dion-hibdon-175078/
              - text: passed away Monday at the age of 58. The son of legendary angler Guido Hibdon, he is survived by his wife, Amy; his children, Payden, Connor and Lawson; and his siblings, Dotty and Chuck.
            - paragraph [ref=e225]: Growing up in mid-Missouri, Dion decided early on to follow in the footsteps of his father, a fellow Bassmaster Classic champion and Bass Fishing Hall of Fame inductee, both in guiding on Lake of the Ozarks and, eventually, fishing professionally. He competed on the FLW Tour for 21 seasons and qualified for 11 Forrest Wood Cups.
            - paragraph [ref=e226]: Longtime former FLW tournament director Bill Taylor remembered Dion as a kind, well-liked competitor who wore the Hibdon name well.
            - paragraph [ref=e227]: “Dion was special,” Taylor said. “He had no enemies. Everyone loved both he and Guido. Especially Dion, he was there to help others as well as himself.
            - paragraph [ref=e228]: “He got along great with all the other anglers and really epitomized what professional bass fishing is all about.”
            - paragraph [ref=e229]: While his legacy is inextricably linked with his father, Dion experienced plenty of his own success. His breakthrough moment came at the 1997 Classic on Logan Martin Lake, which Dion won by a single ounce. He then added a Forrest Wood Cup title on the Red River in 2000. To this day, he is one of just five anglers ever to win both championships.
            - paragraph [ref=e230]: “Dion didn’t necessarily depend on his dad the way he was going to fish,” Taylor said. “They went about it in two different ways. I think Dion was a little bit more versatile than his dad, to be honest.”
            - figure "Dion Hibdon, right, and his father, Guido, are the only father-son duo to both win the Bassmaster Classic. Photo by Rob Newell" [ref=e231]:
              - generic [ref=e232]: Dion Hibdon, right, and his father, Guido, are the only father-son duo to both win the Bassmaster Classic. Photo by Rob Newell
            - paragraph [ref=e233]: Dion, however, was never concerned about paving his own way. After each of his major victories, he never failed to credit his father, with whom he traveled for much of his pro career.
            - paragraph [ref=e234]:
              - text: “When I won the Classic, people made a big deal about me becoming my own fisherman and getting out from beneath my father’s shadow,” he told longtime FLW writer Rob Newell in a 2000
              - link "Bass Fishing Magazine interview" [ref=e235] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/archives/2001-01-01-hibdon-s-heritage/
                - emphasis [ref=e236]: Bass Fishing
                - text: Magazine interview
              - text: . “We just do not see it that way and we never have. If you want to think about this in terms of proverbial shadows, then what people need to realize is that dad casts a pretty big shadow. There are a lot of fishermen under my father’s shadow, and we are going to be there for a long time. We can only hope, as bass fishermen, that one day we are half as good as he is. I am proud to be under his shadow.”
            - paragraph [ref=e237]: Guido, meanwhile, credited Dion with inventing the bait that became synonymous with the family – the Guido Bug. The story goes that Dion made the soft-plastic crawfish imitator, which played a major role in both Guido’s Bassmaster Classic and Dion’s Forrest Wood Cup wins as a jig trailer, in a middle school science class.
            - paragraph [ref=e238]: Dion went on to claim an FLW Series win in 2006 as well as a Toyota Series and two Phoenix Bass Fishing League victories on his home lake, Lake of the Ozarks. Two of his children, Payden and Lawson, have also earned BFL wins on Lake of the Ozarks.
            - paragraph [ref=e239]: Funeral arrangements have not been made public as of this writing.

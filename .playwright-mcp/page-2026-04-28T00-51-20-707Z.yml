        - generic [ref=e288]:
          - heading "Skeet Reese announces plan to retire following 2025 Bass Pro Tour season" [level=1] [ref=e289]
          - heading [level=5]
          - generic [ref=e290]:
            - img "Image for Skeet Reese announces plan to retire following 2025 Bass Pro Tour season" [ref=e291]
            - generic [ref=e292]:
              - text: "Ten-time tour-level winner Skeet Reese will retire at the end of the 2025 Bass Pro Tour season. Photo by Phoenix Moore. Angler:"
              - link "Skeet Reese" [ref=e293] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/skeet-reese/
              - text: .
            - generic [ref=e294]:
              - text: April 22, 2025 • Mitchell Forde •
              - link "Bass Pro Tour" [ref=e295] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/bass-pro-tour/
            - paragraph [ref=e296]:
              - text: Bass Fishing Hall of Famer
              - link "Skeet Reese" [ref=e297] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/skeet-reese/
              - text: announced Tuesday that the 2025
              - link "Bass Pro Tour" [ref=e298] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/circuits/bass-pro-tour/
              - text: season will be his last. Reese, who is in the midst of his 28th season as a full-time touring pro, said following the conclusion of this season he will step back from competition to spend more time with his family and grow his newly launched company, Reese Fishing.
            - paragraph [ref=e299]: “I think there’s lots of factors,” Reese said of his decision. “There is a part of it where it’s just family time, number one – how do I spend more time with my wife and not be on the road as many days a year? Two would be to be able to focus on Reese Fishing and the next chapter of business in my life. Three, I’m like the old man on the tour. I felt like I had run the peak of my career.
            - paragraph [ref=e300]: “I can still win. Obviously, I proved that last year, that I can still win. But the sport is different now; the fishing is different now than it was for the last 25 years of my career. I’m fortunate that the industry has been good to me and we have the ability to make these kind of decisions.”
            - paragraph [ref=e301]: A lifelong California resident, Reese got his start competing on the West Coast. His career went national in 1998, when he competed in both his first Redman All-American and Bassmaster Classic.
            - paragraph [ref=e302]: In the years since, Reese has put together one of the most decorated résumés in the sport. He’s won 10 national tour events, including the 2009 Bassmaster Classic on the Red River. He claimed the 2007 Angler of the Year title on the Bassmaster Elite Series, which he said is still his proudest on-the-water accomplishment. He’s amassed more than $4 million in earnings.
            - paragraph [ref=e303]:
              - text: Reese was one of the founding members of the Bass Pro Tour in 2019. Last June, he proved that he could still win at the highest level by claiming his first BPT trophy on the
              - link "James River" [ref=e304] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/events/2024-bass-pro-tour-stage-six-james-river/
              - text: . That was the highlight of a year that saw him finish 26th in the Fishing Clash Angler of the Year standings, thus qualifying for REDCREST for the second time, and receive induction into the Hall of Fame.
            - paragraph [ref=e305]: “Winning the Bass Pro Tour event last year was kind of like the icing on the cake for me to be able to be like, ‘alright, I did it,'” Reese said. “I know how hard it is to win a tournament at any level. We have a lot of guys on tour that have never won one. So, that was kind of like just a relief, I think. That felt good to be able to hoist a Bass Pro Tour trophy, and I feel content now.”
            - figure "Reese won his long-awaited first Bass Pro Tour trophy at the James River last June. Photo by Phoenix Moore" [ref=e306]:
              - generic [ref=e307]: Reese won his long-awaited first Bass Pro Tour trophy at the James River last June. Photo by Phoenix Moore
            - paragraph [ref=e308]: Perhaps even more than his tournament success, Reese gained a fan following by always showing off his dynamic personality. His vibrant black-and-yellow color scheme became his calling card, and he always looked for opportunities to show off a dance move in the boat or on stage.
            - paragraph [ref=e309]: Even in his retirement, that personality will still be in the spotlight. Reese plans to attend industry events and outdoor shows and remain active on social media. He has hopes to continue to grow Reese Fishing. But after nearly three decades of commuting from California to compete in 10-plus tournaments each year, he’s excited to have more control over his schedule.
            - paragraph [ref=e310]: “(My wife) Kim and I were talking about this last night, and she said, ‘I kind of feel like you’re going to be busier now than you have been,” Reese said with a chuckle. “But I think now it’s a matter of we get to choose our schedule. I want to make sure that part of that time is set aside for us to do whatever (we want), but to not worry about travel logistics and finding houses and all the map studying. Being a professional angler, there’s a lot that goes into it. So, it’s going to be different.”
            - paragraph [ref=e311]:
              - text: Reese will compete in the final four events of the 2025 season, the next stop being
              - link "O’Reilly Auto Parts Stage Four Presented by OPTIMA Batteries" [ref=e312] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/events/2025-05-01-stage-four-chickamauga-and-nickajack/
              - text: ", which kicks off May 1 on Lake Chickamauga. He might have the chance to return for one last event in 2026, too, as he’s currently fourth in the standings to qualify for B&W Trailer Hitches Heavy Hitters."
            - paragraph [ref=e313]: Expect Reese to do everything he can to try and add one more major win before he hangs up his black-and-yellow jersey. His competitive juices continue to flow. However, he recognizes that the time has come to direct more of his energy to his pursuits off the water.
            - paragraph [ref=e314]: “I would have loved to have a REDCREST title and an AOY on the Bass Pro Tour, but I also know that I’m at the point that winning either one of those isn’t going to change what I’ve done in the sport,” Reese said. “It would be just for my own personal reasons. It’s not going to advance the needle in my popularity or my brand. I’ve already done that. I’ve spent the last 40 years fishing tournaments and meeting people and enjoying the process along the way.”
        - generic [ref=e316]:
          - heading "Sprinting to the scales and other tales from a bass tournament in China" [level=1] [ref=e317]
          - heading [level=5]
          - generic [ref=e318]:
            - img "Image for Sprinting to the scales and other tales from a bass tournament in China" [ref=e319]
            - generic [ref=e320]: Bass Pro Tour anglers Matt Becker, Brent Chapman and James Elam competed in an international tournament hosted by MLF China. Photo courtesy of MLF China
            - generic [ref=e321]:
              - text: November 13, 2024 • Mitchell Forde •
              - link "Bass Pro Tour" [ref=e322] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/bass-pro-tour/
            - paragraph [ref=e323]:
              - text: When he flew halfway across the world
              - link "to compete in a tournament" [ref=e324] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/bass-pro-tour/bass-fishing-on-the-other-side-of-the-world/
              - text: in Zanhuang, China, last month,
              - link "Brent Chapman" [ref=e325] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/brent-chapman/
              - text: didn’t really know what to expect. One of his first clues that the competition on Tiantai Lake would be different than anything else he’d experienced across his 30-year pro career came while reading the rules.
            - paragraph [ref=e326]:
              - text: Chapman and fellow KastKing pro
              - link "James Elam" [ref=e327] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/james-elam/
              - text: ", who competed together as a team in the first-of-its-kind international event hosted by MLF China, noticed a clause in the rulebook that urged all competitors to be in good physical condition and to consult a doctor for an exam before competing."
            - paragraph [ref=e328]: That’s odd, Chapman thought. But once the competition got underway, it didn’t take long for the guideline to make sense.
            - paragraph [ref=e329]:
              - text: Somewhat like the
              - link "Bass Pro Tour" [ref=e330] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/circuits/bass-pro-tour/
              - text: ", this tournament featured every-fish-counts scoring. The difference, however, was instead of having an official in each boat to weigh bass right away, anglers drove back to the launch ramp every time they put 10 keepers in the livewell. They’d weigh the haul and return to the water as fast as they could, then do it all over again. Chapman and Elam caught 72 bass on the first day, running up the steep boat dock eight times to weigh in their catch."
            - paragraph [ref=e331]: “It’s like, oh wow, this is quite a workout, lugging a Rubbermaid container of fish up this hill,” Chapman said with a laugh. “If you move slow, the clock’s ticking. You better run up there, because you’re costing yourself casting time. You do that seven times throughout the day, and it’s like, man, this is a workout.”
            - paragraph [ref=e332]:
              - text: The unorthodox weigh-in procedure was one of several memorable experiences that Chapman, Elam and fellow BPT pro
              - link "Matt Becker" [ref=e333] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/matt-becker/
              - text: enjoyed during their trip to China. Now all back in the U.S., the three anglers shared a few highlights from the trip.
            - heading "Breaking down a foreign fishery" [level=3] [ref=e334]
            - figure "Matt Becker competed alongside former MLF angler Thomas Wang. Photo courtesy of MLF China" [ref=e335]:
              - generic [ref=e336]: Matt Becker competed alongside former MLF angler Thomas Wang. Photo courtesy of MLF China
            - paragraph [ref=e337]:
              - text: The three anglers traveled to China with just a suitcase or two of tackle apiece — no rods, no boats and no information about the competition venue. They found Tiantai Lake to be a small, manmade reservoir — Elam didn’t know the exact size, but said it appeared smaller than anywhere he’s visited in
              - link "General Tire Team Series" [ref=e338] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/circuits/team-series/
              - text: or MLF Cup event competition — with plenty of standing timber, rock and manmade cover.
            - paragraph [ref=e339]: While Becker said it reminded him of some Texas fisheries, one significant difference was the forage.
            - paragraph [ref=e340]: “They had kind of a smaller shad in the lake, but there was a lot of shrimp,” Becker said. “A lot of bass were eating shrimp in there.”
            - paragraph [ref=e341]: The anglers thought they would have a day of practice (or “test fishing,” as the Chinese called it) prior to the start of competition. But it turned out test fishing entailed only a brief opportunity to ride around the lake and make a few casts at the launch site.
            - paragraph [ref=e342]: “We got down and got to see what was going to be our boat and just kind of get a feel for what the boat was going to be like, and we got to make a few casts off the dock,” Chapman said. “But just a few casts off the dock catching 1-pounders to 3-pounders, it was like, wow, if the rest of the lake is anything like what it is inside this marina, it’s going to be awesome. And it was.”
            - figure "James Elam shows off two of the 72 keeper bass he and Brent Chapman caught during their first day on China’s Tiantai Lake. Photo courtesy of MLF China" [ref=e343]:
              - generic [ref=e344]: James Elam shows off two of the 72 keeper bass he and Brent Chapman caught during their first day on China’s Tiantai Lake. Photo courtesy of MLF China
            - paragraph [ref=e345]: While a few of the Chinese anglers sported bass boats that Chapman said were as tricked-out as anything an American pro might use on tour, most of the field fished from aluminum vessels. Chapman and Elam were given a 17- or 18-foot aluminum boat with an outboard that wasn’t powerful enough to get it on plane, a 12V trolling motor and no electronics.
            - paragraph [ref=e346]: That didn’t prevent the duo from catching bass in a hurry, though. On the first morning of competition (after an opening ceremony that consisted of some colorful pyrotechnics), Chapman said he caught a 3-pounder on his fifth cast. It took him and Elam about 35 minutes to put their first 10-fish limit in the boat.
            - paragraph [ref=e347]: “Everywhere we went, we were catching fish,” Chapman said. “It seemed like every hour we were catching 10. So, it was a lot of fun.”
            - paragraph [ref=e348]:
              - text: Becker teamed up with
              - link "Thomas Wang" [ref=e349] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/thomas-wang-310578/
              - text: ", a former MLF angler who moved to China around 2010 and who Becker said introduced tournament bass fishing to the Chinese people. Despite neither having been to the lake prior to the week of competition, they had similar success, catching 50 scorable bass on Day 1."
            - paragraph [ref=e350]:
              - text: Every time they returned to the dock with a 10-fish limit, Becker saw other anglers hustling up and down the ramp to the scales. So, he figured he better run, too. (See for yourself on
              - link "Becker’s YouTube channel" [ref=e351] [cursor=pointer]:
                - /url: https://www.youtube.com/channel/UCK1BlXWqSfTiiFlpBY18gPg
              - text: ", where he’s posted videos from test fishing and both days of competition.)"
            - paragraph [ref=e352]: “I wasn’t really sure how serious everyone was going to be,” he said. “But the first 10 that we brought in, I look up and there’s guys literally sprinting back and forth on the dock with buckets of fish, running up to the scale. So, it was mayhem, for sure, but it was fun.”
            - heading "‘A bass is a bass’" [level=3] [ref=e353]
            - figure "Every time they weighed in, anglers had to hustle up the ramp to the scales. Photo courtesy of MLF China" [ref=e354]:
              - generic [ref=e355]: Every time they weighed in, anglers had to hustle up the ramp to the scales. Photo courtesy of MLF China
            - paragraph [ref=e356]: "All three of Chapman, Elam and Becker relied primarily on standard American power-fishing tactics: winding ChatterBaits and spinnerbaits, pitching jigs and creature baits. In Becker’s words: “A bass is a bass on either side of the world.”"
            - paragraph [ref=e357]: While effective, those techniques stood in stark contrast to most of the local anglers’ presentations.
            - paragraph [ref=e358]: Becker said he saw a few Chinese anglers throwing traditional hard baits like bladed jigs and crankbaits, but it was clear that the Japanese bass fishing scene has had a major influence on Chinese anglers. Even though the bass didn’t seem to be shy about biting big baits on heavy line, most of the top local performers opted for small finesse presentations. With the minimum length of a keeper bass being just 20 centimeters (7.87 inches), their goal was to get as many bites as possible.
            - paragraph [ref=e359]: “A lot of guys were throwing tiny little baits — little craws or little Ned rig type baits — just to catch as many fish as they could,” Becker said.
            - figure "KastKing pros Brent Chapman and James Elam finished eighth in the 45-boat field. Photo courtesy of MLF China" [ref=e360]:
              - generic [ref=e361]: KastKing pros Brent Chapman and James Elam finished eighth in the 45-boat field. Photo courtesy of MLF China
            - paragraph [ref=e362]: In another similarity to the Japanese lure scene, the Chinese offerings were quite a bit more detailed than most American baits.
            - paragraph [ref=e363]: “The guy who won was a fellow KastKing pro, but he was a Chinese KastKing pro, and he won the tournament throwing a finessey-type spinnerbait,” Chapman said. “But he’s throwing it on like 8-pound braid with a fluorocarbon leader, and he’s throwing some little, tiny Texas-rigged craw that was probably an inch and a half long.
            - paragraph [ref=e364]:
              - text: “The second day, I’m throwing a 1/2-ounce
              - link "War Eagle spinnerbait" [ref=e365] [cursor=pointer]:
                - /url: https://www.basspro.com/shop/en/war-eagle-tandem-willow-spinnerbaits
              - text: . The War Eagle spinnerbaits, they don’t have eyes on their heads. This guy didn’t understand how I was catching bass on a spinnerbait that didn’t have eyes.”
            - paragraph [ref=e366]: Like just about everyone else, Chapman and Elam found the bite slower the second day, which Elam attributed to fishing pressure put on the small body of water by the 45-boat field. Still, they brought another 30 to 40 bass to the scales.
            - paragraph [ref=e367]: “You could definitely notice that pressure took a toll, because all the fish had gotten caught and moved,” Elam said. “So, that really did make a big difference. And they were holding the fish (in tanks) also during the tournament. So, naturally, there’s just less to be caught.”
            - paragraph [ref=e368]: The event concluded with an awards ceremony that could rival just about any American tour-level event. Each international duo received an commemorative trophy, while Chapman and Elam also earned an award for finishing eighth overall.
            - heading "Food, traffic and other new experiences" [level=3] [ref=e369]
            - figure "The anglers reported a strong turnout from Chinese fans, many of whom had never witnessed a bass tournament or seen a foreigner. Photo courtesy of MLF China" [ref=e370]:
              - generic [ref=e371]: The anglers reported a strong turnout from Chinese fans, many of whom had never witnessed a bass tournament or seen a foreigner. Photo courtesy of MLF China
            - paragraph [ref=e372]: While the competition brought Becker, Chapman and Elam to China, it was far from the only memorable aspect of their trip. Their sightseeing itinerary included a day in Beijing and stops at Tiananmen Square and The Forbidden City. All three anglers raved about the opportunity to experience a new culture and how welcoming the Chinese people were.
            - paragraph [ref=e373]: That was especially true in Zanhuang, a small, remote town that Becker said had never received foreign visitors before. Several locals asked his girlfriend, Brittany, to pose for photos because they’d never seen a woman with blonde hair in person.
            - paragraph [ref=e374]: “They had never seen Americans before, ever,” Becker said. “We were the first foreigners to ever go to this little town. So that was kind of cool to see that and be a part of that.”
            - paragraph [ref=e375]: Trying new food represented another highlight. All three anglers noted that the cuisine in China is drastically different from the “Chinese food” found in the U.S.
            - figure [ref=e376]:
              - iframe [ref=e378]:
                
            - paragraph [ref=e379]: Becker said that, while there were quite a few items that might make most Americans squeamish (the Chinese cook every part of an animal and thus made dishes out of chicken feet or tendons), he found just about everything he tried to be tasty. Both he and Elam pointed to the duck as one of their favorites.
            - paragraph [ref=e380]: “I gotta say, American Chinese food is nothing like Chinese food,” Becker said with a chuckle. “It’s a little different, but much better. We ate a lot of strange things, that’s for sure. But it was all good. Everything we ate was good and fresh. You could tell that they took pride in their food.”
            - paragraph [ref=e381]: "Another shared observation: Motorists in China drove quite a bit faster and more aggressively than in America. That translated to the water, too, even though most of the boats weren’t equipped with high-power outboards. Yet Elam noted that he never saw a wreck."
            - paragraph [ref=e382]: “They drive a lot more aggressively, like close to the dock and things like that,” he said. “That’s how they drive on the road, and I just saw that mirrored in the way that they drive their boat. And they don’t ever really get into any accidents or anything like that. You don’t ever see a car wreck over there.”
            - paragraph [ref=e383]: All in all, each of the anglers enjoyed the experience. Chapman hopes the event achieves its intent of growing the sport of bass fishing in China, because he wants to make the competition an annual trip.
            - paragraph [ref=e384]: “I said, ‘hey, sign me up.’” he said. “I’ll gladly come back to the next one.”

            - paragraph [ref=e248]: The Century Club, which began in 2024 as a way for Major League Fishing to recognize and thank anglers who have fished 100 or more tournaments with MLF and its predecessors (FLW and Operation Bass), added 57 new members to its ranks in 2025. The total now stands at north of 1,200 members, dating back to the beginning of digital recordkeeping in 1994.
            - paragraph [ref=e249]: This week, we’re highlighting four more members of the Century Club. Their ages and experience are varied, but each angler has had an impact on MLF and its predecessors dating back decades – including one who fished his first MLF derby in 1995.
            - figure [ref=e250]
            - heading "Joshua Weaver" [level=3] [ref=e251]
            - paragraph [ref=e252]:
              - text: “Consistent.” That’s one of the best words to describe the career of Macon, Georgia, pro
              - link "Joshua Weaver" [ref=e253] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/joshua-weaver-366059/
              - text: ", who didn’t take too awful long to go from his first BFL as a co-angler in 2010 to the Bass Pro Tour and a REDCREST appearance in 2024. Along the way, Weaver joined the Century Club and has tallied more than half-a-million dollars in career earnings including a Tackle Warehouse Pro Circuit win at Okeechobee in 2023."
            - heading "Eddie Evans" [level=3] [ref=e254]
            - paragraph [ref=e255]:
              - text: If you’ve fished the BFL Mountain Division at any point in the last 30 years, you know the name
              - link "Eddie Evans" [ref=e256] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/eddie-evans-131508/
              - text: . Evans, who’s fished across a bunch of circuits and divisions under the MLF umbrella, fished his first Mountain Division derby in 1995 and finished 55th in points as a co-angler this season with his 189th MLF event.
            - heading "Thomas Helton" [level=3] [ref=e257]
            - paragraph [ref=e258]:
              - link "Thomas Helton" [ref=e259] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/thomas-helton-156824/
              - text: "had a 21-year stretch from 2000 to 2021 in which he fished every season in the BFL Choo Choo Division (as both a co-angler and boater). Also on his résumé: 10 years of Toyota Series competition, a handful of years on the FLW Tour, a pair of Toyota Series Championship showings and two BFL All-American starts. In total, Helton amassed 181 tournaments with MLF."
            - heading "Bobby McMullin" [level=3] [ref=e260]
            - paragraph [ref=e261]:
              - text: Few people have fished as many tournaments under the MLF umbrella as
              - link "Bobby McMullin" [ref=e262] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/bobby-mcmullin-173944/
              - text: (303). The Pevely, Missouri, angler has had his fingerprints all over the organization since 1995 at nearly every level of the sport. He’s a BFL Illini Division staple and has a résumé that includes a bunch of Toyota Series tournaments, several years on the FLW Tour as both a pro and a co-angler, six Toyota Series Championships (two Top 10s) and a couple All-Americans, the first of which resulted in a fourth-place finish in 2002.

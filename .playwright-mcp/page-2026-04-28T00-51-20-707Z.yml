              - link "Major League Fishing" [ref=e490] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/
              - text: (MLF) – in 1983 and has fished a total of 98 tournaments with B.A.S.S. and 178 tournaments with MLF over the past 41 years, winning four events and earning numerous Top 10s. Williams fished professionally with B.A.S.S. from 1987-2003 and professionally with FLW from 1997-1998 and 2004-2008. To this day, he enjoys fishing the occasional Phoenix Bass Fishing League (BFL) tournament in the Mississippi Division.
            - paragraph [ref=e491]: None of the bass clubs in Mississippi in the 70s and 80s had African American members, so Williams and his fellow Black anglers fished in their own club.
            - paragraph [ref=e492]: “Back then, all the bass clubs were full, and there were only three or four tournaments each spring; they didn’t have one every weekend like we do now,” Williams said. “We had a few white guys start joining our club in the late 70s, early 80s. We won a state tournament in 1983, which qualified me for the state team. We then fished a divisional tournament and won, and as the top team member, I qualified for the 1983 Bassmaster Classic.”
            - figure "Williams showcases plaques from the 1983 Bassmaster Classic and his fifth-place finish at the 1988 Tennessee Invitational." [ref=e493]:
              - generic [ref=e494]: Williams showcases plaques from the 1983 Bassmaster Classic and his fifth-place finish at the 1988 Tennessee Invitational.
            - paragraph [ref=e495]: Williams was the first African American angler to qualify for the Classic, which was being held on the Ohio River that year, a fishery Williams had never visited. In fact, the Mississippi native had only fished on Ross Barnett Reservoir up to that point.
            - paragraph [ref=e496]: “My boat was parked with Hank Parker on one side and Rick Clunn on the other side,” Williams said. “I just couldn’t believe it at the time – I still can’t believe it today.”
            - paragraph [ref=e497]: Williams said the whole experience was something he would never forget – from being chauffeured around town, dining out at every meal with the whole Classic entourage, and being catered to throughout the entire event. Williams finished 10th out of 42 competitors, ranking ahead of Parker, Clunn, Denny Brauer and Roland Martin – no small feat for his first major tournament, especially on a new body of water.
            - paragraph [ref=e498]: “Things really started happening for me after that time,” Williams said. “Beating so many of the guys that I’d read about in Bassmaster Magazine, I felt such a sense of accomplishment. It was amazing and really gave me the confidence and determination to continue pursuing my dream.”
            - paragraph [ref=e499]:
              - text: Williams received numerous congratulations after the Classic, including encouraging words from
              - link "Paul Elias" [ref=e500] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/paul-elias/
              - text: ", who advised him to talk to Forrest L. Wood – founder of Ranger Boats – about competing professionally."
            - paragraph [ref=e501]: “I spoke with Forrest, thanking him for letting me use the boat during the Classic, and giving me the opportunity to fish,” Williams said. “I told him I really wanted to get into tournament fishing more and asked if there was anything he could do to help me get started. He told me to write him a letter when I got back home.”
            - paragraph [ref=e502]: Williams wrote the letter, and Wood and Ranger endorsed him and provided his tournament boat for the next 28 years.
            - paragraph [ref=e503]: “I can’t thank Forrest enough for that opportunity and for supplying me with a state-of-the-art boat all those years to follow my passion,” Williams said. “The first tournament I ever won was the Dr. Pepper Open back in 1978. I took home a check for $2,500, which was a huge payday in the late 70s, but knowing my boat was taken care of each year was a huge blessing.”
            - separator [ref=e504]
            - heading "Fast forward to 2024, and the bass-fishing community is celebrating yet another milestone with Williams and his family – as the first African American to be inducted into the Bass Fishing Hall of Fame." [level=2] [ref=e506]:
              - strong [ref=e507]:
                - emphasis [ref=e508]: Fast forward to 2024, and the bass-fishing community is celebrating yet another milestone with Williams and his family – as the first African American to be inducted into the Bass Fishing Hall of Fame.
            - separator [ref=e509]
            - paragraph [ref=e510]:
              - link "Mark Daniels Jr." [ref=e511] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/mark-daniels-jr/
              - text: ", an African American pro who fishes the Major League Fishing (MLF)"
              - link "Bass Pro Tour" [ref=e512] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/circuits/bass-pro-tour/
              - text: ", met Williams through a mutual friend back in 2015, and the two became fast friends. However, Daniels said he’s been looking up to Alfred long before that first meeting."
            - paragraph [ref=e513]: “I was ate up with fishing from a young age, and you just never saw anyone who was African American fishing professionally, so I was really inspired by Alfred,” Daniels said. “I belonged to a bass club, and we had some African American weekend warriors, but no pros.”
            - paragraph [ref=e514]: Daniels expressed the importance for aspiring anglers to see professional anglers that they can identify with, but said that Williams’ influence on the sport runs much deeper than the color of his skin.
            - paragraph [ref=e515]: “Every time the water temp gets above 55 degrees, we can’t wait to fish topwater and throw a frog – and every time I throw a frog, I think of Alfred,” Daniels said. “Regular, hollow-body frogs came out many years ago, with semi-hard plastic legs. Alfred had the inclination to cut off the plastic legs, then cut the skirt off a spinnerbait and push the spinnerbait skirt through the holes on the frog, so it now has spinner-bait style legs as opposed to hard legs.”
            - paragraph [ref=e516]: While Williams didn’t create the frog, he has been attributed for helping put it on the map and helping create the modern-day frog experience.
            - paragraph [ref=e517]: Williams is also credited with adding weight to his favorite Snag Proof models to make them ride lower in the water, dramatically improving his hooksets, as well as adding a rattle chamber to the belly to draw more strikes. Snag Proof incorporated some of Williams’ frog modifications in certain tournament models of its frogs.
            - paragraph [ref=e518]: “You see those types of frogs everywhere now,” Daniels said. “From the highest-end baits made in Japan to all the American-made baits and everything in between, every hollow-body frog has skirted legs, and that is literally Alfred’s design. That blows my mind.
            - paragraph [ref=e519]: “There’s always somebody that takes that first step and breaks the mold, and Alfred is that guy. He’s truly a pioneer in our sport. One can only imagine how apprehensive he was when he first started out, yet he overcame all of that and had a very successful career as a tournament angler. I’m very proud of him and his accomplishments and am happy to call him a friend.”
            - paragraph [ref=e520]:
              - text: Williams’ success over the years has attracted more African American anglers, and opened the door for Daniels,
              - link "Ish Monroe" [ref=e521] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/ish-monroe/
              - text: ","
              - link "Brian Latimer" [ref=e522] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/brian-latimer-170167/
              - text: and other African American anglers along the way. But his impact and his legacy have been far-reaching throughout the entire bass world.
            - figure "In 1987, Williams was credited with saving the lives of two fishermen during the 1987 Rogers-Dingus Barnett Open tournament. The survivor, James E. Michael, wrote a letter to the postmaster, lauding Williams for his “concern for his fellow man.”" [ref=e523]:
              - button "Enlarge" [ref=e524] [cursor=pointer]:
                - img [ref=e525]
              - generic [ref=e527]:
                - text: In 1987, Williams was credited with saving the lives of two fishermen
                - strong [ref=e528]
                - text: during the 1987 Rogers-Dingus Barnett Open tournament. The survivor, James E. Michael, wrote a letter to the postmaster, lauding Williams for his “concern for his fellow man.”
            - paragraph [ref=e529]:
              - link "Dudley Salers" [ref=e530] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/dudley-salers-132181/
              - text: is a lifelong friend of Williams who’s competed with him for over 50 years. Salers and Williams fished the former
              - link "Red Man Trail" [ref=e531] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/press-releases/2000-05-01-red-man-trail-offers-competitive-fishing-for-everyone/
              - text: together in the 70s – now known as the
              - link "Phoenix Bass Fishing League" [ref=e532] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/circuits/bfl/
              - text: – but never let their competitive nature come before their friendship.
            - paragraph [ref=e533]: “I have a lot of respect for Alfred and am proud to call him my friend. He’s just a genuinely nice person and treats everyone with respect,” said the 83-year-old Salers. “He called to tell me he’d been nominated, and I was so happy for him. I told him it’s an honor just to be nominated, but when they selected him, I was thrilled. Alfred’s had a lot of success in his lifetime, and a lot of opportunities that could have changed him, but he’s never let it go to his head. He’s just always been the same old Alfred.”
            - paragraph [ref=e534]:
              - text: That sentiment is shared throughout the bass community.
              - link "Bill Taylor" [ref=e535] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/press-releases/mlf-senior-director-of-operations-bill-taylor-announces-retirement/
              - text: – former MLF Tournament Director and the longest-tenured tournament director in the company’s history – said he started watching Williams when he fished for Bassmaster in the ’70s, not realizing at the time that he was watching history in the making.
            - paragraph [ref=e536]: “I watched him his first few years, then followed him on the Red Man Trail, but I didn’t meet him until the late ’80s when he was fishing the BFL’s,” Taylor said. “I took a liking to Alfred because he was a great angler and was very well respected. His wife, Gracie, traveled with him on tour and they were just a lovely couple. Everyone loved him.
            - paragraph [ref=e537]: “Alfred inspired a lot of people throughout his lifetime and continues to inspire today. I grew up in the ’50s and ’60s and saw firsthand the racial tension throughout the country. Race was never brought up the entire time I worked with Alfred, but I admire him deeply for getting involved in professional fishing when he did, because it had to have been a challenge.”
            - figure "The Mississippi native embraces his wife of 53 years, Gracie, and expresses his thanks for her “unwavering support” through the years." [ref=e538]:
              - generic [ref=e539]:
                - text: The Mississippi native embraces his wife of 53 years, Gracie, and expresses his thanks for her “unwavering support” through the years.
                - strong [ref=e540]
            - paragraph [ref=e541]: Williams said after everything he’s experienced in his lifetime, being inducted into the Bass Fishing Hall of Fame is just the icing on the cake.
            - paragraph [ref=e542]: “I feel very, very honored,” he said. “I want to thank all the people who not only supported me but believed in me. I’m just overwhelmed, really, to be the first African American inducted into the Hall of Fame. There can only be one ‘first’ and it truly means a lot to me to be the first.”
            - paragraph [ref=e543]:
              - link "Kathy Fennel" [ref=e544] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/press-releases/major-league-fishings-kathy-fennel-named-2023-game-changer-by-sports-business-journal/
              - text: ", MLF Executive Vice President and General Manager, had only been on the bass-fishing scene for one year when the Mississippi Division of the Red Man Trail was launched in 1983. Fennel was the assigned Tournament Administrator for that division and remembers Williams’ start on the Red Man Trail fondly."
            - paragraph [ref=e545]: “Alfred was a fierce competitor, but was such a gentleman and always extremely professional,” Fennel said. “From the moment we met, I was impressed by his demeanor and the way he presented himself. He was – and still is – a pioneer in our industry and a great representative for his sponsors.”
            - paragraph [ref=e546]: Fennel, who was inducted into the Bass Fishing Hall of Fame in 2022 and serves as a member of the Hall of Fame board, said she’s excited about Williams’ induction and feels it has been a long time coming.
            - paragraph [ref=e547]: “It makes me very proud to see the Hall of Fame recognize Alfred for his accomplishments,” Fennel said. “Beyond his ability as a competitor and his longevity in the sport, he has a unique opportunity to influence a larger audience that hasn’t been as engaged in professional tournament fishing, and we’re honored to be a part of his story.”
            - separator [ref=e548]
            - heading "Williams doesn’t take that sentiment or the responsibility it requires lightly." [level=2] [ref=e550]:
              - strong [ref=e551]:
                - emphasis [ref=e552]: Williams doesn’t take that sentiment or the responsibility it requires lightly.
            - separator [ref=e553]
            - paragraph [ref=e554]: “I’m just so thankful that I was able to accomplish these feats and have individuals follow me and my journey over the years,” Williams said. “All the Black anglers who have fished with me over the past 40-something years, have thanked me for my influence and accomplishments. I feel fortunate to be the one that it happened to, all those years ago.”
            - figure "A self-described “family man,” Williams is pictured boating with three of his grandchildren, Ethan, Akira and his second grandchild, Xavier, who now tags along with his grandpa on fishing adventures. Photo courtesy of Williams" [ref=e555]:
              - generic [ref=e556]: A self-described “family man,” Williams is pictured boating with three of his grandchildren, Ethan, Akira and his second grandchild, Xavier, who now tags along with his grandpa on fishing adventures. Photo courtesy of Williams
            - paragraph [ref=e557]: But success like Williams’ doesn’t just happen. It comes from a lot of hard work and not being afraid to step out and take chances, and it requires respect, grace, admiration and trust – all trademarks of Williams’ life story, a life story that’s far from over.
            - paragraph [ref=e558]: “At 77, I still fish tournaments almost every weekend and I would still be out on tour, but I finally decided enough’s enough,” Williams said, laughing. “I’ve enjoyed every minute of it. When I started fishing tournaments, I wasn’t thinking about trying to qualify for the Classic or where I was going to be later in life, I was just focused on fishing the tournament in front of me.”
            - paragraph [ref=e559]: Williams said that was the key to longevity in the sport, but even more than that, endurance – and success – in everyday life.
            - paragraph [ref=e560]: “Always put yourself in a position to do well, in whatever you do in life,” Williams said. “If you believe in yourself, then you aren’t going to be dependent on anybody else to show you the way.”

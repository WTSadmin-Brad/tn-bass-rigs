          - heading "Bradley Roy’s High School Open Presented by Covercraft Continues for 10th Year" [level=1] [ref=e601]
          - heading [level=5]
          - generic [ref=e602]:
            - img "Image for Bradley Roy’s High School Open Presented by Covercraft Continues for 10th Year" [ref=e603]
            - generic [ref=e604]: The Bradley Roy High School Open Presented by Covercraft was held for the 10th year on Oct. 8. Photo courtesy J.D. Blackburn
            - generic [ref=e605]:
              - text: October 18, 2022 • J.D. Blackburn •
              - link "High School Fishing" [ref=e606] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/high-school/
            - paragraph [ref=e607]:
              - text: JAMESTOWN, Ky. – The 2022
              - link "Bradley Roy High School Open Presented by Covercraft" [ref=e608] [cursor=pointer]:
                - /url: https://bradleyroy.com/high-school-open/
              - text: ", was one of the most closely contested chapters in the tournament’s 10-year history. For the first time, the winning team on Saturday also triumphed in the Sunday fish-off."
            - paragraph [ref=e609]: On Oct. 8, 139 high school teams and 34 junior teams (6-8th grade) competed at Lake Cumberland and the top five fished the following day on the Beaver Creek section of Barren River Lake in Glasgow, Kentucky.
            - paragraph [ref=e610]: "The top five teams on Saturday were:"
            - list [ref=e611]:
              - listitem [ref=e612]:
                - text: "1"
                - superscript [ref=e613]: st
                - text: "place – Zavian Smith – Lake Cumberland Bass Club: 11.96"
              - listitem [ref=e614]:
                - text: "2"
                - superscript [ref=e615]: nd
                - text: "place – Jake Mattingly – Danville Christian Academy: 11.83"
              - listitem [ref=e616]:
                - text: "3"
                - superscript [ref=e617]: rd
                - text: "place – Coleman Stewart/Keenan Stewart – Boyle County: 10.95"
              - listitem [ref=e618]:
                - text: "4"
                - superscript [ref=e619]: th
                - text: "place – Scotty Hagan/Mason Hagan – Edmonson County: 9.41"
              - listitem [ref=e620]:
                - text: "5"
                - superscript [ref=e621]: th
                - text: "place – Porter Conover/Hunter Duvall – Trinity High School: 8.83"
            - iframe [ref=e622]:
              
            - paragraph [ref=e623]:
              - text: Following the Saturday weigh-in,
              - link "Roy" [ref=e624] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/bradley-roy/
              - text: gathered the top five teams and prepared them for a fish-off on Sunday at a mystery destination.
            - paragraph [ref=e625]: The five remaining teams were housed at the Riverside Inn and geared up for a Major League Fishing Cup-style tournament the next day. The Bass Pro Tour angler convened the group in the parking lot at 4:30 a.m. on Sunday and led a convoy west on the Cumberland Parkway. The teams didn’t know their destination until they arrived at the Beaver Creek section of Barren River Lake in Glasgow.
            - figure [ref=e627]
            - paragraph [ref=e628]: “I picked Barren River Lake this year as our mystery lake; it’s a lake I have had a lot of history and success on,” Roy said. “It was fascinating to see these high school anglers attack this body of water as I did year after year on the Kentucky Junior Circuit.”
            - paragraph [ref=e629]: Each team was assigned boat officials trained by Roy and provided two sets of MLF-supplied scales. Teams were given 30 minutes to ride around on the designated section of the 10,100-acre fishery.
            - paragraph [ref=e630]: Roy streamed commentary on his social media pages as he covered the action. The teams fished two 2.5-hour sessions, with a 30-minute break in between.
            - figure [ref=e632]
            - paragraph [ref=e633]: The conditions on Barren River Lake were frigid to begin the morning, with temperatures around freezing, warming up with high bluebird skies as the day progressed. Roy commented during the live stream that the weather conditions played a significant factor in the difficulty of the fishing and would make every catch even more crucial to the outcome. As temperatures warmed, the frequency of catches from all five teams increased.
            - paragraph [ref=e634]: Entering the second and final period of fishing, Lake Cumberland Bass Club’s Zavian Smith and Boyle County’s Coleman and Keenan Stewart were neck and neck. An early period catch by Edmonson County’s Scotty and Mason Hagan catapulted them into the lead over both teams. However, back-to-back scorable catches midway through the period by Smith were enough to push him back into the lead and fend off challenges by the four other teams. Smith finished with a winning weight of 5 pounds, 4 ounces.
            - figure [ref=e636]
            - paragraph [ref=e637]: After confirming the scores from all teams, Roy interviewed the winner and his boat captain and mother, Judith Dyehouse. Roy asked Smith how he felt about the MLF Cup-style format and Scoretracker.
            - paragraph [ref=e638]: “It gets your nerves going,” Smith said. “I was getting nervous when the other teams started catching fish.”
            - paragraph [ref=e639]: He went on to say that he stuck to his game plan and was thankful that he could get the win. Following the event, Smith and boat captain Dyehouse met with the media to further discuss the victory.
            - paragraph [ref=e640]: “He fished his heart out,” Dyehouse said. “I was pretty impressed with some of the big fish he had to net by himself. I couldn’t believe it. He did wonderfully!”
            - figure [ref=e641]
            - paragraph [ref=e642]: When Smith was asked about how his mom served as a boat captain, he responded, “Pretty good!’ That question was quickly followed up about how she served as a mom, they both laughed, and he said, “really good!”
            - paragraph [ref=e643]: Both team members from the top two teams were offered four-year, $10,000 scholarships to attend Campbellsville University by head coach Pete Hedgepath. Kentucky Christian also offered four-year scholarships to teams in the top five. In all, the potential scholarships were close to $300,000.
            - paragraph [ref=e644]:
              - text: On Sunday, Smith and the team of Scotty and Mason Hagan earned berths in the
              - link "2023 Major League Fishing High School National Championship" [ref=e645] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/circuits/high-school/
              - text: .
            - figure [ref=e647]
            - paragraph [ref=e648]: "Significant general scholarships for all teams were made possible by Covercraft, First Southern National Bank, The Cain Pole, A Few Good Men Fishing Tournament, LCR Contracting, City of Jamestown, Angler’s Outpost and Marine, and Land Big Fish. Additional prizes from sponsors of the event and Bradley Roy included: Ark Fishing, Bass Pro Shops, Railblaza, Solar Bat, Land Big Fish, The Cain Pole, Mercury, and D&L Tackle."
            - paragraph [ref=e649]: “I want to shout out to everyone who helped me pull this tournament off for the 10th consecutive year,” Roy said. “If you have ever run a tournament, you know this stuff does not happen easily; I have an awesome staff, family, and sponsors. Even though this tournament has my name on it, I am just a small part, and none of this happens without them.
            - paragraph [ref=e650]: “Our winner this year, Zavian Smith, his mom was also the boat captain. This year in our top five, we had two mother boat captains, which is so awesome. Last year we had our first female angler in the top five. It’s just so cool to see that and know that this is not just a sport limited to men, that a wider audience can join in,” Roy said.
            - paragraph [ref=e651]: Covercraft contributed to the scholarship fund and provided event decals for all anglers, coaches, volunteers, and family members.
            - paragraph [ref=e652]: “Being able to support Bradley and an event that means so much to the future of fishing is a joy for us. We are proud of his efforts over these past ten years to grow these young people as anglers and as young men and women,” said Jeff Jegelewicz, Director of Marketing at Covercraft.
            - paragraph [ref=e653]: “We were thrilled to host the Bradley Roy High School fishing tournament again and have students from around Kentucky experience the great fall fishing on Lake Cumberland,” said Regena Hinton, Mayor of Jamestown.
            - paragraph [ref=e654]: “Lake Cumberland Tourist Commission was excited to host the Bradley Roy High School Open here on Lake Cumberland,” said Danielle Wilson, Executive Director of the Lake Cumberland Tourist Commission. “The turnout was huge and benefited the county in more ways than one! We hope to have the event back each year!”
        - generic [ref=e656]:
          - heading "From Bass Boat to Kayak in Two Days as Jackson Roumbanis Wins His First-Ever Kayak Tournament" [level=1] [ref=e657]
          - heading [level=5]
          - generic [ref=e658]:
            - img "Image for From Bass Boat to Kayak in Two Days as Jackson Roumbanis Wins His First-Ever Kayak Tournament" [ref=e659]
            - generic [ref=e660]: Jackson Roumbanis earned a win in his first-ever kayak tournament. Photo by Fred Roumbanis.
            - generic [ref=e661]:
              - text: October 10, 2022 • Kendra Cousineau •
              - link "Angler News" [ref=e662] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/angler-news/
            - paragraph [ref=e663]:
              - link "Jackson Roumbanis" [ref=e664] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/jackson-roumbanis-2/
              - text: is no stranger to fishing. His dad (Bass Pro Tour angler
              - link "Fred Roumbanis" [ref=e665] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/fred-roumbanis/
              - text: ) had him fishing in diapers and he learned from some of the best bass anglers in the world. However, until September, Jackson was a stranger to fishing out of a kayak, much less fishing out of a kayak in his first ever pro-level tournament.
            - paragraph [ref=e666]: The 15-year-old high school sophomore shocked everyone when he won the Hobie Bass Open Series event on Lake Dardanelle (Sept. 17-18) in a tiebreaker over veteran Francis Tran. In doing so, Jackson became the youngest-ever winner on the Hobie Bass Open Series – astoundingly, just two days after he made his very first cast from a kayak.
            - heading "From Bass Boat to Kayak in Two Days" [level=2] [ref=e667]:
              - strong [ref=e668]: From Bass Boat to Kayak in Two Days
            - paragraph [ref=e669]:
              - text: When your dad is a pro and you grow up around the likes of
              - link "Jordan Lee" [ref=e670] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/jordan-lee/
              - text: ","
              - link "Kevin VanDam" [ref=e671] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/kevin-vandam/
              - text: ","
              - link "Mark Daniels, Jr." [ref=e672] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/mark-daniels-jr/
              - text: and
              - link "Ott DeFoe" [ref=e673] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/ott-defoe/
              - text: ", you’re bound to know a little about bass fishing. And Jackson Roumbanis"
              - emphasis [ref=e674]: knows
              - text: bass fishing.
            - paragraph [ref=e675]: He’s won two AOYs in his youth circuit in Arkansas, with 10 tournament wins to boot.
            - paragraph [ref=e676]: “You would never know that because this kid is so humble,” Fred said. “His versatility is there, and he’s going to be scary (good) one day. He already is scary.”
            - paragraph [ref=e677]:
              - text: But unbeknownst to Fred, who was fishing Mille Lacs at the time for
              - link "Bally Bet Stage Seven" [ref=e678] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/events/2022-bass-pro-tour-mille-lacs-lake/
              - text: ", one of Jackson’s friends in the kayak fishing community had convinced him to compete in the September Hobie Open and offered him a boat to use. Jackson informed his mom, Julie, the Tuesday before the start of the weekend tournament that he needed to pick up a kayak, and he splashed his new boat on Thursday. By Saturday morning, he was competing on Lake Dardanelle."
            - paragraph [ref=e679]: Jackson had to be confident in the spots he chose to fish, mainly because Fred would have to drop him off in the morning and he had no way to load and unload in different spots around Lake Dardanelle. Luckily for Jackson, Dardanelle is basically his home water.
            - paragraph [ref=e680]: The first full day on the water didn’t come without its difficulties.
            - paragraph [ref=e681]: “Oh, it was something else,” Jackson said. “I got out there the first day and tried to fish using the same techniques I would from a bass boat, and realized it was a lot harder. There were new techniques and new things I had to adapt to. I forced myself to be confident in those spots, even though I knew there would be hours where I wouldn’t get a bite.”
            - paragraph [ref=e682]: Fred believes that Jackson’s patience is his biggest strength as an angler.
            - paragraph [ref=e683]: “He knows how to wait fish out,” Fred said. “(That’s important) when you can’t turn a key on a boat and go anywhere. All he had was a paddle, an anchor, and four rods.”
            - paragraph [ref=e684]: There were other obstacles to overcome and mistakes that any rookie could make when competing out of a kayak for the first time.
            - paragraph [ref=e685]: “About a quarter through the second day, I ran out of the worms I was using,” Jackson said with a laugh.
            - paragraph [ref=e686]: Not to mention the impact of fishing from a kayak for the first time – for seven hours a day – can have on the body.
            - paragraph [ref=e687]: “I was so exhausted,” Jackson admits. “I was extremely sore, and my legs were jelly.”
            - paragraph [ref=e688]: Although Fred couldn’t stay to watch full competition days, he paid close attention to the areas that Jackson chose to fish both days of the tournament … until he felt he was making him nervous.
            - paragraph [ref=e689]: “I raced home to turn on the scoreboard, and was like, ‘Whoa, he really is catching them!’,” Fred said.
            - figure "Jackson’s “fishiness” is the result of growing up and fishing with his bass-pro dad Fred all his life. Photo courtesy Fred Roumbanis" [ref=e690]:
              - generic [ref=e691]: Jackson’s “fishiness” is the result of growing up and fishing with his bass-pro dad Fred all his life. Photo courtesy Fred Roumbanis
            - heading "Down to the Tiebreaker" [level=2] [ref=e692]:
              - strong [ref=e693]: Down to the Tiebreaker
            - paragraph [ref=e694]: Following two days of fishing where he racked up 165 inches of bass on Dardanelle, Jackson stood nervously in the post-event meeting as tournament officials called out the results and places. He was thrilled knowing that he had done well enough at his first-ever large-scale tournament to get a check.
            - paragraph [ref=e695]: What he didn’t expect was to hear his name being called during the top five, and then the top three.
            - paragraph [ref=e696]: “My face lit up even more,” Jackson admits. “Not only was I getting a check, but I was getting a trophy and the chance to compete even more.”
            - paragraph [ref=e697]: Then, something even more unexpected happened. Jackson’s two-day cumulative total of 165 inches was matched by Francis Tran, meaning that the event winner would be determined by a tiebreaker – the longest/biggest fish. Jackson’s biggest bass stretched 18.5 inches, Tran’s measured 18.0 inches. Jackson won by a half-inch.
            - paragraph [ref=e698]: “When they announced that a 15-year-old kid was in the top five, everyone in the building was like ‘wait, what?’ And they all were very supportive and shocked that (Jackson) was able to come out and do this,” Fred said.
            - paragraph [ref=e699]: The Roumbanis family hosted a barbecue after the tournament for the local kayak-fishing crowd and were impressed by how good Jackson had done against experienced pros.
            - paragraph [ref=e700]: “People were going around, chatting about how many they had caught, and it was somewhere around the range of seven to nine fish,” Fred said. “Then they would ask Jackson, and he caught 27 fish throughout the tournament. It was just unbelievable.”
            - heading "Moving Ahead to Championship Event" [level=2] [ref=e701]:
              - strong [ref=e702]: Moving Ahead to Championship Event
            - paragraph [ref=e703]:
              - text: After winning the Dardanelle Hobie Open, Jackson immediately qualified to fish the Hobie Tournament of Champions on Caddo Lake in Louisiana, starting Nov. 11. At the same time, Fred is fishing in the third
              - link "General Tire Team Series" [ref=e704] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/circuits/team-series/
              - text: qualifier with his powerhouse team of
              - link "Dustin Connell" [ref=e705] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/dustin-connell/
              - text: and
              - link "Cole Floyd" [ref=e706] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/cole-floyd/
              - text: .
            - paragraph [ref=e707]: However, that isn’t stopping Fred. He plans to drive all night to be there for Jackson when he gets off the water.
            - paragraph [ref=e708]: “Hopefully we can both be winners!” Fred said.
            - paragraph [ref=e709]: Jackson plans to spend more time in his kayak in the weeks leading up to the Caddo Lake tournament, to become more familiar with the boat and hone his natural skills.
            - paragraph [ref=e710]: “I have a ton of confidence starting out, but I don’t want to be overconfident,” Jackson said. “With having the little experience that I do have, fishing against these top pros is going to be something to look forward to.”
            - paragraph [ref=e711]: When he launches his kayak at Caddo Lake, Jackson will be fishing a body of water that neither he nor Fred has ever fished. Fred is confident that Jackson will figure it out, and will have fun doing it.
            - paragraph [ref=e712]: “Whether it’s a tournament or not, Jackson just goes out and has fun, and then he still does good,” Fred said. “There’s no doubt that Jackson will be on the Bass Pro Tour with me one day.”
        - generic [ref=e714]:
          - heading "Biffle, Fennel, Martens Inducted into the Bass Fishing Hall of Fame" [level=1] [ref=e715]
          - heading [level=5]
          - generic [ref=e716]:
            - img "Image for Biffle, Fennel, Martens Inducted into the Bass Fishing Hall of Fame" [ref=e717]
            - generic [ref=e718]:
              - text: October 7, 2022 • Rachel Dubrovin •
              - link "Angler News" [ref=e719] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/angler-news/
            - paragraph [ref=e720]:
              - text: SPRINGFIELD, Mo. – Pro anglers and fishing industry moguls from all over the country traveled to the Bass Pro Shops Headquarters in Springfield on Thursday to celebrate the Bass Fishing Hall of Fame Class of 2022. Oklahoma pro
              - link "Tommy Biffle" [ref=e721] [cursor=pointer]:
                - /url: http://Tommy Biffle
              - text: and MLF Executive Vice President and General Manager Kathy Fennel were each given an iconic blue blazer and a plaque that recognizes their contributions to the bass fishing industry. The late
              - link "Aaron Martens" [ref=e722] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/aaron-martens/
              - text: was posthumously inducted into the Hall of Fame. Several members of the Martens family attended the celebration, including Aaron’s wife, Lesley, his mother Carol and his children, Jordan and Spencer.
            - paragraph [ref=e723]: Biffle delivered the first speech of the evening and he kept the entire room rolling with laughter. He joked that he’d rather be throwing a drop-shot than giving a speech in front of a banquet hall full of people, but became emotional when talking about how much a Hall of Fame induction means to him.
            - paragraph [ref=e724]: “The Bass Fishing Hall of Fame is probably the biggest honor that I’ll ever have,” Biffle said while holding back tears.
            - paragraph [ref=e725]: The Biffle Bug creator showed appreciation for several people, including Johnny Morris and Ray Scott, and he didn’t forget to thank his “main sponsor,” his wife, Sharron.
            - paragraph [ref=e726]:
              - text: When it was time to award the Martens family with Aaron’s Hall of Fame plaque, the crowd watched a tribute video of MLF pros talking about how much they love and respect Aaron as a friend and as a legend of the sport. Much of the crowd teared up while watching Lesley accept Aaron’s plaque from
              - link "Kevin VamDam" [ref=e727] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/kevin-vandam/
              - text: .
            - paragraph [ref=e728]: “What I love most about this sport, this industry, is the people,” Fennell said during her acceptance speech. “Aaron Martens’ life and legacy is a shining example of the brightest and the best. We all miss him.”
            - paragraph [ref=e729]: Fennell was a key figure in the FLW organization since 1982 and is now one of the most influential people in the fishing industry. As MLF’s executive vice president & general manager, Fennel oversees day-to-day operations, making sure the organization continues to provide prestigious, well-organized tournaments.
            - paragraph [ref=e730]: “My entire career has been spent working alongside the most dedicated, loyal and hardest-working group of people in the world,” she said. “The only reason I’m standing here today is because of them.”
            - paragraph [ref=e731]:
              - text: The Bass Fishing Hall of Fame is located in Johnny Morris’ Wonders of Wildlife Museum in Springfield.
              - link "You can learn more about the organization here" [ref=e732] [cursor=pointer]:
                - /url: https://www.bassfishinghof.com/
              - text: .
        - generic [ref=e752]:
          - heading "VanDam Goes to NASCAR’s Victory Lane" [level=1] [ref=e753]
          - heading [level=5]
          - generic [ref=e754]:
            - img "Image for VanDam Goes to NASCAR’s Victory Lane" [ref=e755]
            - generic [ref=e756]:
              - text: September 26, 2022 • Alan McGuckin •
              - link "Angler News" [ref=e757] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/angler-news/
            - paragraph [ref=e758]:
              - text: Trophy presentations are certainly nothing new to
              - link "Kevin VanDam" [ref=e759] [cursor=pointer]:
                - /url: https://majorleaguefishing.com/anglers/kevin-vandam/
              - text: . But when Bass Pro Shops founder Johnny Morris asked “KVD” to join him in Victory Lane to present the winner’s trophy last Saturday night at NASCAR’s Bass Pro Shops Night Race at Bristol Motor Speedway, the longtime Toyota angler was a bit astonished.
            - paragraph [ref=e760]: Longshot driver Christopher Buescher won the race, and not only did VanDam help with the trophy presentation, but he may very well have won the award for the guy who had the most fun at the iconic half-mile track on the Tennessee-Virginia border.
            - paragraph [ref=e761]: His day began with a visit to the local Bass Pro Shops store where Toyota was offering fans the chance to take a ride in the all-new 2022 Tundra. Then, it was off to the track where he did a fishing seminar for race fans, got a little mud on the tires at Toyota’s ride and drive course, presented driver Martin Truex a ‘good luck’ crankbait, and even got invited to take a lap in the ‘pace truck’ to begin the race.
            - paragraph [ref=e762]: “I’ve had some phenomenal experiences around NASCAR, and Johnny asking me to join him in Victory Lane at Bristol was certainly one of them. But like most things in life, it’s all about people. I’ve become close friends with drivers Martin Truex, Jeff Burton and Ryan Newman, as well as some of the car chiefs like “Cheddar” and so many others,” said VanDam.
            - paragraph [ref=e763]: “Tons of people in the NASCAR community love to fish when they’re not busting their tails to win races, and there’s no sport I follow more closely than NASCAR when I’m not on the water. My radio is turned to the NASCAR station on Sirius XM about 90% of the time in my Tundra,” he said.
            - paragraph [ref=e764]: “I love the short tracks like Bristol and Richmond where you’re so close to the action, but there’s a whole lot to be said for standing near the wall at the superspeedways when the cars blow by you in a pack at 200 mph,” added VanDam. “The bottom line is I just love NASCAR.”
            - paragraph [ref=e765]: No doubt, the multitude of memories he made last Saturday at Bristol only deepened his passion for the sport that runs just a short lap behind bass fishing on the list of sports he loves.
